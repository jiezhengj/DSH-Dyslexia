<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>dsh-dyslexia fixture</title>
    <style>
      :root {
        --dsw-alias-bg-base: #ffffff;
        --dsw-alias-bg-layer-1: #f6f7fb;
        --dsw-alias-bg-layer-2: #eceef7;
        --dsw-alias-border-l1: #d8dae6;
        --dsw-alias-border-l2: #b9bdd0;
        --dsw-alias-brand-primary: #4a6cf7;
        --dsw-alias-label-primary: #101014;
        --dsw-alias-label-secondary: #5b5f72;
        --dsw-alias-state-error-primary: #d93025;
        --dsw-alias-state-idle-primary: #8a8f9e;
        --dsw-alias-state-success-primary: #1f9d55;
        --dsw-alias-state-warn-primary: #c98a00;
        --dsw-specific-sidebar-fill: #f2f3f8;
      }
      body {
        margin: 0;
        padding: 8px;
        font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--dsw-alias-label-primary);
        background: var(--dsw-alias-bg-base);
      }
      #log {
        font: 12px/1.4 ui-monospace, monospace;
        white-space: pre-wrap;
        margin: 0 0 12px;
      }
      .stage {
        width: 360px;
        border: 1px dashed var(--dsw-alias-border-l2);
      }
      .host-block {
        white-space: pre-wrap;
        font: 13px/1.4 ui-monospace, monospace;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <pre id="log"></pre>
    <div id="mount"></div>
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script>
      window.__results = []
      window.__module = null
      window.__loaderCalls = 0
      window.__ModuleLoader__ = {
        load(spec) {
          window.__loaderCalls += 1
          try {
            window.__module = spec.factory((name) => (name === 'react' ? window.React : undefined))
          } catch (error) {
            window.__results.push(['bad', 'loader threw: ' + String(error && error.message)])
          }
        },
      }
    </script>
    <script src="../../client.js"></script>
    <script>
      ;(async function () {
        const React = window.React
        const ReactDOM = window.ReactDOM
        const results = window.__results
        const LANGS = ['zh', 'en', 'ja', 'es', 'fr', 'de', 'ru', 'pt']
        const EXACT = {
          zh: { name: '图', show: '查看源码', copy: '复制源码', hidden: '隐藏源码', copied: '已复制', failed: '复制失败' },
          en: { name: 'Diagram', show: 'Show source', copy: 'Copy source', hidden: 'Hide source', copied: 'Copied', failed: 'Copy failed' },
          ja: { name: '図', show: 'ソースを表示', copy: 'ソースをコピー', hidden: 'ソースを隠す', copied: 'コピーしました', failed: 'コピーできませんでした' },
          es: { name: 'Diagrama', show: 'Mostrar el código', copy: 'Copiar el código', hidden: 'Ocultar el código', copied: 'Copiado', failed: 'No se pudo copiar' },
          fr: { name: 'Schéma', show: 'Afficher la source', copy: 'Copier la source', hidden: 'Masquer la source', copied: 'Copié', failed: 'Échec de la copie' },
          de: { name: 'Diagramm', show: 'Quelle anzeigen', copy: 'Quelle kopieren', hidden: 'Quelle ausblenden', copied: 'Kopiert', failed: 'Kopieren fehlgeschlagen' },
          ru: { name: 'Диаграмма', show: 'Показать код', copy: 'Копировать код', hidden: 'Скрыть код', copied: 'Скопировано', failed: 'Не удалось скопировать' },
          pt: { name: 'Diagrama', show: 'Mostrar o código', copy: 'Copiar o código', hidden: 'Ocultar o código', copied: 'Copiado', failed: 'Não foi possível copiar' },
        }
        const missingLanguage = LANGS.filter((lang) => !EXACT[lang] || !EXACT[lang].copied)
        const CODE = 'flowchart LR\n  A[Text] --> B[Picture]'
        const BAD = 'flowchart TD\n  A-->'
        const WIDE = 'flowchart LR\n  A[aaaaaaaaaaaaaaaaaaaa] --> B[bbbbbbbbbbbbbbbbbbbb]\n  B --> C[cccccccccccccccccccc]'

        const tick = (ms) => new Promise((resolve) => setTimeout(resolve, typeof ms === 'number' ? ms : 40))

        function ok(name, detail) {
          results.push(['ok', name + (detail ? ' — ' + detail : '')])
        }

        function bad(name, detail) {
          results.push(['bad', name + (detail ? ' — ' + detail : '')])
        }

        function expect(condition, name, detail) {
          if (condition) ok(name, detail)
          else bad(name, detail)
        }

        function hostBlock(code) {
          return React.createElement('pre', { className: 'host-block' }, code)
        }

        // A stand-in host that behaves like cordis 4.1: whatever an effect setup
        // (or a locale/slot registration) returns is a disposer, and stopping the
        // fiber runs them in reverse. Without that, a fixture can never show
        // whether the plugin cleans up after itself.
        function makeContext(options) {
          const defs = []
          const disposers = []
          const calls = { effects: 0, layersDropped: 0, stringsDropped: 0 }
          const slots = {
            register(def, component) {
              if (options && options.rejectLocale && def && def.locale) throw new Error('host rejects locale')
              defs.push({ def, component })
              return () => {
                const index = defs.findIndex((entry) => entry.component === component)
                if (index !== -1) defs.splice(index, 1)
                calls.layersDropped += 1
              }
            },
            inject(name, fn) {
              const disposer = fn()
              const drop = () => {
                if (typeof disposer === 'function') disposer()
              }
              disposers.push(drop)
              return drop
            },
          }
          const ctx = {
            slots,
            effect(fn) {
              calls.effects += 1
              const disposer = fn()
              const drop = () => {
                if (typeof disposer === 'function') disposer()
              }
              disposers.push(drop)
              return drop
            },
          }
          if (!(options && options.noLocale)) {
            ctx.locale = {
              register() {
                return () => {
                  calls.stringsDropped += 1
                }
              },
            }
          }
          return {
            ctx,
            defs,
            calls,
            dispose() {
              while (disposers.length > 0) disposers.pop()()
            },
          }
        }

        function mount(Layer, props) {
          const stage = document.createElement('div')
          stage.className = 'stage'
          document.getElementById('mount').appendChild(stage)
          const root = ReactDOM.createRoot(stage)
          let threw = null
          try {
            root.render(React.createElement(Layer, props))
          } catch (error) {
            threw = error
          }
          return { stage, root, threw }
        }

        function buttonsIn(stage) {
          return Array.prototype.slice.call(stage.querySelectorAll('button')).map((button) => button.textContent)
        }

        /* ------------------------------------------------ module and layer */
        try {
          expect(window.__loaderCalls === 1, 'loading client.js registers one factory')
          const module = window.__module
          expect(module && typeof module.apply === 'function', 'the module exposes apply')
          expect(module && Array.isArray(module.inject) && module.inject.join(',') === 'slots', 'the module asks for slots only', String(module && module.inject))
          const { ctx, defs } = makeContext({})
          module.apply(ctx)
          expect(defs.length === 1, 'apply registers exactly one fence layer', 'count ' + defs.length)
          const def = defs[0].def || {}
          expect(def.name === 'conversation.chat.markdown.fence', 'layer sits on the fence slot', def.name)
          expect(def.key === 'mermaid', 'layer is keyed to mermaid', String(def.key))
          expect(def.id === '@jiezhengj/dsh-dyslexia/mermaid', 'layer id', String(def.id))
          expect(def.order === 100, 'layer order', String(def.order))
          expect(def.locale === 'dyslexia', 'layer claims the locale namespace', String(def.locale))
          const Layer = defs[0].component
          window.__layer = Layer

          /* ------------------------------------------------------ languages */
          expect(missingLanguage.length === 0, 'every interface language has expectations', missingLanguage.join(','))
          const seen = {}
          for (const lang of LANGS) {
            document.documentElement.lang = lang
            const view = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
            await tick(80)
            const figure = view.stage.querySelector('[role="img"]')
            const labels = buttonsIn(view.stage)
            const token = (figure && figure.getAttribute('aria-label')) || ''
            const exact = EXACT[lang]
            expect(token === exact.name, `[${lang}] the picture carries a plain name`, token)
            expect(labels[0] === exact.show && labels[1] === exact.copy, `[${lang}] first render shows the two buttons`, labels.join(' | '))
            expect(!!figure, `[${lang}] a picture is drawn`)
            expect(labels.length === 2, `[${lang}] exactly two buttons`, String(labels.length))
            const bare = labels.concat([token]).filter((text) => /copySource|showSource|hideSource|figureLabel|copied|copyFailed/.test(text))
            expect(bare.length === 0, `[${lang}] no internal key reaches the screen`, bare.join(','))
            if (view.stage.querySelector('.dsh-dyslexia-bar button')) {
              const toggle = view.stage.querySelectorAll('button')[0]
              expect(toggle.getAttribute('aria-expanded') === 'false', `[${lang}] the source toggle starts collapsed`)
              toggle.click()
              await tick(30)
              const hiddenLabels = buttonsIn(view.stage)
              expect(hiddenLabels[0] === exact.hidden, `[${lang}] the source toggle flips its word`, hiddenLabels[0])
              expect(toggle.getAttribute('aria-expanded') === 'true', `[${lang}] the source toggle announces itself as expanded`)
              const marker = view.stage.querySelector('.dsh-dyslexia-source code')
              expect(!!marker && /(^| )language-mermaid( |$)/.test(marker.className), `[${lang}] the expanded source keeps its fence language`, marker ? marker.className : 'no marker')
              expect(view.stage.querySelector('[role="presentation"]') !== null, `[${lang}] the mount point is presentational`)
            }
            const languageClipboard = Object.getOwnPropertyDescriptor(navigator, 'clipboard')
            Object.defineProperty(navigator, 'clipboard', {
              configurable: true,
              value: { writeText: () => Promise.resolve() },
            })
            const copyNode = view.stage.querySelectorAll('button')[1]
            if (copyNode) copyNode.click()
            await tick(40)
            const spoken = view.stage.querySelector('[role="status"]')
            expect(
              spoken !== null && spoken.textContent === exact.copied,
              `[${lang}] the copy answer is announced in words`,
              (spoken ? spoken.textContent : 'no status') + ' / expected ' + exact.copied,
            )
            const spokenBox = spoken !== null ? getComputedStyle(spoken) : null
            const spokenVisible = spoken !== null && spokenBox.display !== 'none' && spoken.getClientRects().length > 0
            expect(
              spokenVisible && spokenBox !== null && parseFloat(spokenBox.fontSize) >= 10,
              `[${lang}] the copy answer can be read, not only heard`,
              (spokenBox ? spokenBox.fontSize + ' / ' + spokenBox.color : 'no status'),
            )
            Object.defineProperty(navigator, 'clipboard', {
              configurable: true,
              value: { writeText: () => Promise.reject(new Error('denied by the harness')) },
            })
            if (copyNode) copyNode.click()
            await tick(40)
            const refused = view.stage.querySelector('[role="status"]')
            expect(
              refused !== null && refused.textContent === exact.failed,
              `[${lang}] a refused clipboard says so`,
              (refused ? refused.textContent : 'no status') + ' / expected ' + exact.failed,
            )
            if (languageClipboard) Object.defineProperty(navigator, 'clipboard', languageClipboard)
            else delete navigator.clipboard
            seen[lang] = token + '|' + labels.join('|')
            view.root.unmount()
            view.stage.remove()
          }
          const en = seen.en
          const untranslated = LANGS.filter((lang) => lang !== 'en' && seen[lang] === en)
          expect(untranslated.length === 0, 'every interface language actually translates', untranslated.join(','))

          /* ------------------------------- the fence language comes from the host */
          const otherFence = mount(Layer, { code: CODE, lang: 'mmd', streaming: false, children: hostBlock(CODE) })
          await tick(90)
          const otherToggle = otherFence.stage.querySelector('.dsh-dyslexia-bar button')
          if (otherToggle) {
            otherToggle.click()
            await tick(30)
            const otherMarker = otherFence.stage.querySelector('.dsh-dyslexia-source code')
            expect(
              !!otherMarker && /(^| )language-mmd( |$)/.test(otherMarker.className),
              'the source block keeps the language the host sent',
              otherMarker ? otherMarker.className : 'no marker',
            )
          } else {
            expect(false, 'the source block keeps the language the host sent', 'no source toggle')
          }
          otherFence.root.unmount()
          otherFence.stage.remove()

          /* ------------------------------------------------- host translate */
          document.documentElement.lang = 'zh'
          const hostVariants = [
            ['echoes the key', (key) => key, 'key echo'],
            ['throws', () => {
              throw new Error('locale service changed')
            }, 'throwing t'],
            ['answers blanks', () => '   ', 'blank answer'],
            ['echoes key with a value', (key) => key + ':value', 'key echo with value'],
            ['leaves a placeholder', () => '{{missing}}', 'unfilled placeholder'],
          ]
          for (const [label, t, tag] of hostVariants) {
            const view = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE), t })
            await tick(60)
            const labels = buttonsIn(view.stage)
            const token = (view.stage.querySelector('[role="img"]') || { getAttribute: () => '' }).getAttribute('aria-label')
            expect(labels[0] === '查看源码' && labels[1] === '复制源码' && token === '图', `a host t that ${label} still shows words`, labels.join(' | ') + ' / ' + token)
            view.root.unmount()
            view.stage.remove()
          }

          /* ---------------------------------------------------- host props */
          const streamingTrue = mount(Layer, { code: CODE, streaming: true, children: hostBlock(CODE) })
          await tick(50)
          expect(!streamingTrue.stage.querySelector('[role="img"]') && streamingTrue.stage.textContent.indexOf(CODE) !== -1, 'a streaming fence shows only the host block')
          streamingTrue.root.unmount()
          streamingTrue.stage.remove()

          const streamingOne = mount(Layer, { code: CODE, streaming: 1, children: hostBlock(CODE) })
          await tick(50)
          expect(!streamingOne.stage.querySelector('[role="img"]'), 'a truthy streaming flag is honoured')
          streamingOne.root.unmount()
          streamingOne.stage.remove()

          const codeGetter = { streaming: false, children: hostBlock(CODE) }
          Object.defineProperty(codeGetter, 'code', {
            enumerable: true,
            get() {
              throw new Error('code getter exploded')
            },
          })
          let codeGetterThrew = null
          let codeGetterView = null
          try {
            // The element is built with plain props first, then its frozen props
            // bag is turned hostile — this is how a host upgrade would hand a
            // getter to the layer without React copying it at creation time.
            const stage = document.createElement('div')
            stage.className = 'stage'
            document.getElementById('mount').appendChild(stage)
            const root = ReactDOM.createRoot(stage)
            const element = React.createElement(Layer, { streaming: false, children: hostBlock(CODE) })
            Object.defineProperty(element.props, 'code', {
              enumerable: true,
              get() {
                throw new Error('code getter exploded')
              },
            })
            root.render(element)
            codeGetterView = { stage, root }
          } catch (error) {
            codeGetterThrew = error
          }
          await tick(60)
          expect(!codeGetterThrew, 'a throwing code getter does not reach the host')
          expect(!!codeGetterView && codeGetterView.stage.textContent.indexOf(CODE) !== -1, 'a throwing code getter leaves the host block', codeGetterView ? JSON.stringify(codeGetterView.stage.textContent.slice(0, 40)) : 'no view')
          if (codeGetterView) {
            codeGetterView.root.unmount()
            codeGetterView.stage.remove()
          }

          const childrenGetter = { code: CODE, streaming: false }
          let childrenThrew = null
          let childrenView = null
          try {
            const stage = document.createElement('div')
            stage.className = 'stage'
            document.getElementById('mount').appendChild(stage)
            const root = ReactDOM.createRoot(stage)
            const element = React.createElement(Layer, { code: CODE, streaming: false })
            Object.defineProperty(element.props, 'children', {
              enumerable: true,
              get() {
                throw new Error('children getter exploded')
              },
            })
            root.render(element)
            childrenView = { stage, root }
          } catch (error) {
            childrenThrew = error
          }
          await tick(80)
          // React 18 renders asynchronously, so a throw inside work never reaches
          // this try block: what must be asserted is the visible outcome, not the
          // absence of an exception here. A host block we cannot even read must
          // still leave the reader its source text.
          expect(!childrenThrew, 'a throwing children getter does not reach the host')
          expect(
            !!childrenView && childrenView.stage.textContent.indexOf(CODE) !== -1,
            'a throwing children getter leaves the source',
            childrenView ? JSON.stringify(childrenView.stage.textContent.slice(0, 40)) : 'no view',
          )
          if (childrenView) {
            childrenView.root.unmount()
            childrenView.stage.remove()
          }

          // A Proxy is the same hazard from the other side: reading the value does
          // not throw, the trap does. Whatever the props bag does, this fence may
          // lose its picture — the message around it may not be emptied.
          const proxyStage = document.createElement('div')
          proxyStage.className = 'stage'
          document.getElementById('mount').appendChild(proxyStage)
          const proxyRoot = ReactDOM.createRoot(proxyStage)
          const proxyElement = React.createElement(Layer, { code: CODE, streaming: false })
          Object.defineProperty(proxyElement.props, 'children', {
            enumerable: true,
            get() {
              return new Proxy(
                {},
                {
                  get() {
                    throw new Error('hostile get')
                  },
                  has() {
                    throw new Error('hostile has')
                  },
                },
              )
            },
          })
          proxyRoot.render(proxyElement)
          await tick(90)
          expect(
            proxyStage.textContent.indexOf(CODE) !== -1,
            'a fence whose props read throws is left to the host, not the message',
            JSON.stringify(proxyStage.textContent.slice(0, 40)),
          )
          proxyRoot.unmount()
          proxyStage.remove()

          const stringCode = mount(Layer, { code: 42, streaming: false, children: hostBlock('fallback') })
          await tick(50)
          expect(stringCode.stage.textContent.indexOf('fallback') !== -1 && !stringCode.stage.querySelector('[role="img"]'), 'a non-string fence is left to the host')
          stringCode.root.unmount()
          stringCode.stage.remove()

          /* -------------------------------------------------- draw failures */
          const broken = mount(Layer, { code: BAD, streaming: false, children: hostBlock(BAD) })
          await tick(80)
          const brokenNote = broken.stage.querySelector('.dsh-dyslexia-note')
          expect(!!brokenNote, 'a broken diagram says why')
          expect(brokenNote ? /源码/.test(brokenNote.textContent) : false, 'the reason is a complete sentence', brokenNote ? brokenNote.textContent : '')
          expect(brokenNote ? /Parse error/.test(brokenNote.textContent) === false : false, 'the engine English is not pasted into the sentence')
          expect(broken.stage.textContent.indexOf(BAD) !== -1, 'a broken diagram keeps the host block')
          broken.root.unmount()
          broken.stage.remove()

          const orphan = mount(Layer, { code: BAD, streaming: false })
          await tick(80)
          expect(orphan.stage.textContent.indexOf(BAD) !== -1, 'a broken diagram without host children still shows its source')
          orphan.root.unmount()
          orphan.stage.remove()

          const htmlDescriptor = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML')
          let armed = true
          Object.defineProperty(Element.prototype, 'innerHTML', {
            configurable: true,
            get() {
              return htmlDescriptor.get.call(this)
            },
            set(value) {
              if (armed) throw new Error('html assignment exploded')
              htmlDescriptor.set.call(this, value)
            },
          })
          let drawThrowView = null
          try {
            drawThrowView = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
          } catch (error) {
            void error
          }
          await tick(120)
          armed = false
          Object.defineProperty(Element.prototype, 'innerHTML', htmlDescriptor)
          if (drawThrowView) {
            expect(!!drawThrowView.stage.querySelector('.dsh-dyslexia-note'), 'a throwing engine leaves a sentence')
            expect(drawThrowView.stage.textContent.indexOf(CODE) !== -1, 'a throwing engine keeps the host block')
            drawThrowView.root.unmount()
            drawThrowView.stage.remove()
          } else {
            bad('a throwing engine leaves a sentence', 'the layer did not render at all')
          }

          /* ------------------------------------- a new source, a new picture */
          // The fence is re-rendered in place when its text changes. A panel the
          // reader opened must fold away, and a "Copied" answer must not outlive
          // the text it described — otherwise a broken replacement shows the same
          // source twice, once as a panel and once as the host's own block.
          const swappedView = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
          await tick(80)
          const swappedFirst = swappedView.stage.querySelectorAll('button')[0]
          if (swappedFirst) swappedFirst.click()
          await tick(60)
          expect(
            swappedView.stage.querySelectorAll('.dsh-dyslexia-source').length === 1,
            'the opened panel is on screen before the source changes',
            String(swappedView.stage.querySelectorAll('.dsh-dyslexia-source').length),
          )
          swappedView.root.render(React.createElement(Layer, { code: BAD, streaming: false, children: hostBlock(BAD) }))
          await tick(140)
          const swappedCopies = swappedView.stage.textContent.split(BAD).length - 1
          expect(
            swappedCopies === 1,
            'a source swapped for a broken one is shown once, not twice',
            'copies=' + swappedCopies + ' panels=' + swappedView.stage.querySelectorAll('.dsh-dyslexia-source').length,
          )
          expect(!!swappedView.stage.querySelector('.dsh-dyslexia-note'), 'the swapped-in failure still says why')
          swappedView.root.unmount()
          swappedView.stage.remove()

          const answerView = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
          await tick(80)
          const answerClipboardBackup = navigator.clipboard
          Object.defineProperty(navigator, 'clipboard', {
            configurable: true,
            value: { writeText: () => Promise.resolve() },
          })
          const answerButtons = buttonsIn(answerView.stage)
          if (answerButtons.length > 1) answerView.stage.querySelectorAll('button')[1].click()
          await tick(60)
          const answered = answerView.stage.querySelector('[role="status"]')
          expect(
            answered !== null && answered.textContent === '已复制',
            'the copy answer is on screen before the source changes',
            answered ? answered.textContent : 'none',
          )
          answerView.root.render(
            React.createElement(Layer, { code: 'flowchart LR\n  A[Second] --> B[Second picture]', streaming: false, children: hostBlock(CODE) }),
          )
          await tick(120)
          const cleared = answerView.stage.querySelector('[role="status"]')
          expect(
            cleared !== null && cleared.textContent === '',
            'a copy answer does not outlive the source it described',
            cleared ? cleared.textContent : 'none',
          )
          answerView.root.unmount()
          answerView.stage.remove()
          Object.defineProperty(navigator, 'clipboard', {
            configurable: true,
            value: answerClipboardBackup,
          })

          /* ------------------------------------------------------- copying */
          const clipboardBackup = navigator.clipboard
          let clipboardCalls = 0
          Object.defineProperty(navigator, 'clipboard', {
            configurable: true,
            get() {
              return undefined
            },
          })
          const noClipboard = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
          await tick(60)
          const noClipboardButtons = noClipboard.stage.querySelectorAll('button')
          if (noClipboardButtons[1]) noClipboardButtons[1].click()
          await tick(40)
          const noClipboardStatus = noClipboard.stage.querySelector('[role="status"]')
          expect(
            noClipboardStatus !== null && noClipboardStatus.textContent === '复制失败' && buttonsIn(noClipboard.stage)[1] === '复制源码',
            'a missing clipboard is reported, not faked',
            (noClipboardStatus ? noClipboardStatus.textContent : 'none') + ' / ' + buttonsIn(noClipboard.stage).join(' | '),
          )
          noClipboard.root.unmount()
          noClipboard.stage.remove()

          Object.defineProperty(navigator, 'clipboard', {
            configurable: true,
            get() {
              return {
                writeText() {
                  clipboardCalls += 1
                  return Promise.resolve()
                },
              }
            },
          })
          const withClipboard = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
          await tick(60)
          const withClipboardButtons = withClipboard.stage.querySelectorAll('button')
          if (withClipboardButtons[1]) withClipboardButtons[1].click()
          await tick(60)
          expect(clipboardCalls === 1, 'the copy button writes once', String(clipboardCalls))
          const withClipboardStatus = withClipboard.stage.querySelector('[role="status"]')
          expect(
            withClipboardStatus !== null && withClipboardStatus.textContent === '已复制' && buttonsIn(withClipboard.stage)[1] === '复制源码',
            'a real copy is reported as copied',
            (withClipboardStatus ? withClipboardStatus.textContent : 'none') + ' / ' + buttonsIn(withClipboard.stage).join(' | '),
          )
          withClipboard.root.unmount()
          withClipboard.stage.remove()
          Object.defineProperty(navigator, 'clipboard', { configurable: true, value: clipboardBackup })

          /* ------------------------------------------- a message with more than one fence */
          {
            const message = document.createElement('div')
            message.setAttribute('data-message', 'keep')
            const before = document.createElement('p')
            before.textContent = 'Before the first diagram the message keeps its words.'
            const between = document.createElement('p')
            between.textContent = 'Between the two diagrams the message keeps its words.'
            const after = document.createElement('p')
            after.textContent = 'After the second diagram the message keeps its words.'
            const firstHost = document.createElement('div')
            const secondHost = document.createElement('div')
            message.appendChild(before)
            message.appendChild(firstHost)
            message.appendChild(between)
            message.appendChild(secondHost)
            message.appendChild(after)
            document.getElementById('mount').appendChild(message)
            const firstRoot = ReactDOM.createRoot(firstHost)
            const secondRoot = ReactDOM.createRoot(secondHost)
            firstRoot.render(React.createElement(Layer, { code: 'flowchart LR\n  A --> B', streaming: false, children: hostBlock('first') }))
            secondRoot.render(React.createElement(Layer, { code: 'sequenceDiagram\n  A->>B: hi', streaming: false, children: hostBlock('second') }))
            await tick(160)
            const figures = message.querySelectorAll('[role="img"]')
            const prose = message.querySelectorAll('p')
            const secondFigure = secondHost.querySelectorAll('[role="img"]')
            expect(figures.length === 2, 'two fences draw two pictures', `${figures.length}`)
            expect(secondFigure.length === 1, 'the second fence draws its own picture', `${secondFigure.length}`)
            expect(
              prose.length === 3 && prose[0].textContent.indexOf('Before') === 0 && prose[2].textContent.indexOf('After') === 0,
              'the prose around a picture is left alone',
              `${prose.length}`,
            )
            const order = Array.from(message.children).map((node) => (node.querySelector && node.querySelector('[role="img"]') ? 'figure' : node.tagName.toLowerCase()))
            expect(order.join(',') === 'p,figure,p,figure,p', 'the picture and the prose keep their order', order.join(','))
            firstRoot.unmount()
            secondRoot.unmount()
            message.remove()
          }

          /* --------------------------------------------------- narrow screen */
          const narrow = mount(Layer, { code: 'flowchart LR\n' + Array.from({ length: 16 }, (_, index) => `  N${index} --> N${index + 1}`).join('\n'), streaming: false, children: hostBlock('wide') })
          await tick(120)
          const narrowFigure = narrow.stage.querySelector('.dsh-dyslexia-figure')
          const stageWidth = narrow.stage.clientWidth
          // A control that proves this harness can measure an overflow at all: an
          // unconstrained box wider than the column must make the stage scroll.
          const probe = document.createElement('div')
          probe.setAttribute('data-probe', 'overflow')
          probe.style.cssText = 'width:4000px;height:2px'
          narrow.stage.appendChild(probe)
          expect(narrow.stage.scrollWidth > stageWidth + 100, 'the column measurement can see an overflow', narrow.stage.scrollWidth + '/' + stageWidth)
          probe.remove()
          expect(narrow.stage.scrollWidth <= stageWidth + 1, 'the column goes back to fitting once the control is gone', narrow.stage.scrollWidth + '/' + stageWidth)
          expect(!!narrowFigure && Math.abs(narrowFigure.clientWidth - stageWidth) <= 8, 'the picture takes the column width', (narrowFigure ? narrowFigure.clientWidth : 0) + '/' + stageWidth)
          expect(narrow.stage.scrollWidth <= stageWidth + 1, 'a wide picture does not widen the column', narrow.stage.scrollWidth + '/' + stageWidth)
          const pageOverflow = document.documentElement.scrollWidth - document.documentElement.clientWidth
          expect(pageOverflow <= 1, 'the page itself never overflows', String(pageOverflow))
          // The engine adapts itself, but the column cap and the inner scroll are
          // ours: with the stylesheet gone the box would grow and the page would
          // scroll sideways instead.
          const figureBox = narrowFigure ? getComputedStyle(narrowFigure) : null
          expect(figureBox !== null && figureBox.maxWidth === '100%', 'the picture box is capped to the column', figureBox ? figureBox.maxWidth : 'no box')
          expect(figureBox !== null && figureBox.boxSizing === 'border-box', 'the picture box counts its own padding', figureBox ? figureBox.boxSizing : 'no box')
          expect(figureBox !== null && figureBox.overflowX === 'auto', 'a wide picture scrolls inside its own box', figureBox ? figureBox.overflowX : 'no box')

          /* --------------------------------------------------------- theme */
          const themed = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
          await tick(90)
          const themedText = themed.stage.querySelector('svg[role="img"] text')
          const firstFill = themedText ? getComputedStyle(themedText).fill : ''
          themed.stage.style.setProperty('--dsw-alias-label-primary', 'rgb(1, 2, 3)')
          await tick(60)
          const secondText = themed.stage.querySelector('svg[role="img"] text')
          const secondFill = secondText ? getComputedStyle(secondText).fill : ''
          expect(!!themedText && !!secondText, 'a drawn picture has text to colour')
          expect(firstFill !== '' && firstFill !== secondFill, 'the picture follows the host colour without reloading', firstFill + ' -> ' + secondFill)
          themed.root.unmount()
          themed.stage.remove()
          narrow.root.unmount()
          narrow.stage.remove()

          /* ---------------------------------------------- host that says no */
          const retry = makeContext({ rejectLocale: true })
          let retryThrew = null
          try {
            window.__module.apply(retry.ctx)
          } catch (error) {
            retryThrew = error
          }
          expect(!retryThrew, 'a host that rejects the locale option does not break apply')
          expect(retry.defs.length === 1, 'the layer is registered once after the retry', String(retry.defs.length))
          expect(!!retry.defs[0] && retry.defs[0].def.locale === undefined, 'the retried registration drops the locale option', JSON.stringify(retry.defs[0] && retry.defs[0].def))

          for (const hostile of [undefined, null, {}, { slots: null }, { slots: {} }, { slots: { inject() {}, register() {} } }, { slots: { inject() { throw new Error('inject refused') }, register() {} } }]) {
            let hostileThrew = null
            try {
              window.__module.apply(hostile)
            } catch (error) {
              hostileThrew = error
            }
            expect(!hostileThrew, 'apply stays silent on a changed host', String(hostileThrew && hostileThrew.message))
          }

          /* ------------------- stop the fiber: what is left behind */
          const life = makeContext()
          window.__module.apply(life.ctx)
          expect(!!document.getElementById('dsh-dyslexia-figure-style'), 'styles arrive with apply', String(!!document.getElementById('dsh-dyslexia-figure-style')))
          expect(life.defs.length === 1, 'one fence layer while installed', String(life.defs.length))
          expect(life.calls.effects >= 2, 'styles and strings are claimed as effects', String(life.calls.effects))
          const lifeStage = document.createElement('div')
          lifeStage.className = 'stage'
          document.getElementById('mount').appendChild(lifeStage)
          const lifeRoot = ReactDOM.createRoot(lifeStage)
          lifeRoot.render(React.createElement(life.defs[0].component, { code: CODE, streaming: false, children: hostBlock(CODE) }))
          await tick(120)
          expect(!!lifeStage.querySelector('.dsh-dyslexia-figure'), 'the layer draws while the fiber lives', String(!!lifeStage.querySelector('.dsh-dyslexia-figure')))
          lifeRoot.unmount()
          life.dispose()
          await tick(60)
          expect(!document.getElementById('dsh-dyslexia-figure-style'), 'disabling the plugin takes its stylesheet away', String(!!document.getElementById('dsh-dyslexia-figure-style')))
          expect(life.calls.stringsDropped === 1, 'the locale registration is dropped', String(life.calls.stringsDropped))
          expect(life.defs.length === 0, 'the fence layer is gone once the host disposes', String(life.defs.length))
          lifeStage.remove()

          // A host that offers no `ctx.effect` cannot promise us a teardown. The
          // stylesheet is still added (the picture needs it), but a second apply
          // must reclaim the first one instead of stacking a new copy.
          const noEffect = makeContext()
          delete noEffect.ctx.effect
          window.__module.apply(noEffect.ctx)
          window.__module.apply(noEffect.ctx)
          const strayStyles = document.querySelectorAll('style[id="dsh-dyslexia-figure-style"]')
          expect(
            strayStyles.length === 1,
            'a host without effects keeps one stylesheet, not one per apply',
            String(strayStyles.length),
          )
          Array.prototype.slice.call(strayStyles).forEach((node) => node.remove())
          /* ---------------------------------- no internal key is ever shown */
          const keys = ['copyFailed', 'copySource', 'engineUnavailable', 'figureLabel', 'renderFailed', 'syntaxError']
          const keyEcho = mount(Layer, { code: BAD, streaming: false, children: hostBlock(BAD), t: (key) => key })
          await tick(90)
          const keyEchoText = keyEcho.stage.textContent + ' ' + Array.from(keyEcho.stage.querySelectorAll('[aria-label]')).map((node) => node.getAttribute('aria-label')).join(' ')
          const leaked = keys.filter((key) => keyEchoText.indexOf(key) !== -1)
          expect(leaked.length === 0, 'no internal key reaches the eye', 'leaked: ' + leaked.join(', '))
          keyEcho.root.unmount()
          keyEcho.stage.remove()

          /* ------------------------------------- a picture nobody can draw */
          const huge = 'flowchart LR\n' + Array.from({ length: 900 }, (_, index) => `  N${index}[node ${index}] --> N${index + 1}[node ${index + 1}]`).join('\n')
          const hugeView = mount(Layer, { code: huge, streaming: false, children: hostBlock('huge') })
          await tick(160)
          expect(!!hugeView.stage.querySelector('.dsh-dyslexia-note'), 'a source past the size limit says why', hugeView.stage.textContent.slice(0, 40))
          expect(hugeView.stage.textContent.indexOf('huge') !== -1, 'a source past the size limit keeps the host block')
          hugeView.root.unmount()
          hugeView.stage.remove()

          /* ----------------------------------- streaming turns into a picture */
          const turnStage = document.createElement('div')
          turnStage.className = 'stage'
          document.getElementById('mount').appendChild(turnStage)
          const turnRoot = ReactDOM.createRoot(turnStage)
          turnRoot.render(React.createElement(Layer, { code: CODE, streaming: true, children: hostBlock(CODE) }))
          await tick(60)
          const duringStream = !turnStage.querySelector('[role="img"]')
          turnRoot.render(React.createElement(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) }))
          await tick(120)
          expect(duringStream && !!turnStage.querySelector('[role="img"]'), 'the picture appears when the stream ends')
          turnRoot.unmount()
          turnStage.remove()

          /* ------------------------------- a host that hands over empty children */
          const emptyChildren = mount(Layer, { code: BAD, streaming: false, children: false })
          await tick(90)
          expect(emptyChildren.stage.textContent.indexOf(BAD) !== -1, 'a falsy children is not mistaken for content', emptyChildren.stage.textContent.slice(0, 40))
          emptyChildren.root.unmount()
          emptyChildren.stage.remove()

          /* ------------------- a host that hands over something React refuses */
          // A plain object, a function, or an array holding one: React throws
          // #31 while rendering, and if that happened inside this layer's own
          // boundary the boundary could not catch it — the message would vanish.
          const refused = [
            { label: 'object', value: { nope: true }, streaming: true },
            { label: 'function', value: () => null, streaming: true },
            { label: 'object in a failed picture', value: { nope: true }, streaming: false },
            { label: 'array with an object', value: [hostBlock(BAD), { nope: true }], streaming: false },
          ]
          for (const scenario of refused) {
            const stage = document.createElement('div')
            stage.className = 'stage'
            document.getElementById('mount').appendChild(stage)
            const root = ReactDOM.createRoot(stage)
            let threw = null
            const consoleErrors = []
            const originalError = console.error
            console.error = (...args) => {
              consoleErrors.push(String(args[0]))
            }
            try {
              root.render(
                React.createElement(Layer, {
                  code: scenario.streaming ? CODE : BAD,
                  streaming: scenario.streaming,
                  children: scenario.value,
                }),
              )
              await tick(120)
            } catch (error) {
              threw = error
            } finally {
              console.error = originalError
            }
            const text = stage.textContent.trim()
            expect(
              !threw && stage.childNodes.length > 0 && text.length > 0,
              `a refused children cannot empty the message — ${scenario.label}`,
              threw ? String(threw).slice(0, 60) : `children=${stage.childNodes.length} text=${text.slice(0, 20)}`,
            )
            expect(
              consoleErrors.every((line) => line.indexOf('#31') === -1),
              `no React error 31 escapes — ${scenario.label}`,
              consoleErrors.join(' / ').slice(0, 80),
            )
            root.unmount()
            stage.remove()
          }

          /* --------------------------- streaming with no host block at all */
          const streamingEmpty = mount(Layer, { code: CODE, streaming: true, children: null })
          await tick(90)
          expect(
            streamingEmpty.stage.textContent.indexOf(CODE.trim()) !== -1 || streamingEmpty.stage.querySelector('pre'),
            'a streaming block with no host children still shows its source',
            streamingEmpty.stage.textContent.slice(0, 30),
          )
          streamingEmpty.root.unmount()
          streamingEmpty.stage.remove()

          /* ------------------------------- a new t must not redraw the picture */
          const stableStage = document.createElement('div')
          stableStage.className = 'stage'
          document.getElementById('mount').appendChild(stableStage)
          const stableRoot = ReactDOM.createRoot(stableStage)
          stableRoot.render(React.createElement(Layer, { code: CODE, streaming: false, children: hostBlock(CODE), t: (key) => (key === 'figureLabel' ? '图' : key) }))
          await tick(120)
          const firstSvg = stableStage.querySelector('svg[role="img"]')
          if (firstSvg) firstSvg.setAttribute('data-stamp', 'first')
          stableRoot.render(React.createElement(Layer, { code: CODE, streaming: false, children: hostBlock(CODE), t: (key) => (key === 'figureLabel' ? '图' : key) }))
          await tick(120)
          const secondSvg = stableStage.querySelector('svg[role="img"]')
          expect(!!firstSvg && !!secondSvg && secondSvg.getAttribute('data-stamp') === 'first', 'a fresh t does not redraw the picture')
          stableRoot.unmount()
          stableStage.remove()

          /* ------------------- a re-layout must name the drawing again */
          const resizeStage = document.createElement('div')
          resizeStage.className = 'stage'
          resizeStage.style.width = '800px'
          document.getElementById('mount').appendChild(resizeStage)
          const resizeRoot = ReactDOM.createRoot(resizeStage)
          document.documentElement.lang = 'zh'
          resizeRoot.render(React.createElement(Layer, { code: WIDE, streaming: false, children: hostBlock(WIDE) }))
          await tick(200)
          const wideBefore = resizeStage.querySelector('svg')
          const beforeAttrs = wideBefore
            ? wideBefore.getAttribute('role') + '|' + wideBefore.getAttribute('aria-label')
            : 'none'
          expect(
            !!wideBefore && beforeAttrs === 'img|图',
            'the drawing is named when it is first laid out',
            beforeAttrs,
          )

          // The engine swaps the whole <svg> when it re-lays-out (innerHTML), and
          // the fresh node carries role="graphics-document document" with an
          // English aria-roledescription and no name. A resize in a headless
          // fixture does not always wrap the text, so the swap is reproduced the
          // way the engine does it: replace the node with engine-shaped markup and
          // assert the view puts the name back. Deleting the mutation watcher makes
          // this fail, which is the point.
          const figureHost = resizeStage.querySelector('.dsh-dyslexia-figure')
          const engineShaped = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
          engineShaped.setAttribute('role', 'graphics-document document')
          engineShaped.setAttribute('aria-roledescription', 'flowchart')
          engineShaped.setAttribute('viewBox', '0 0 120 40')
          engineShaped.setAttribute('width', '120')
          engineShaped.setAttribute('height', '40')
          const swapped = { before: wideBefore }
          if (figureHost) {
            figureHost.textContent = ''
            figureHost.appendChild(engineShaped)
          }
          await tick(120)
          const renamed = figureHost ? figureHost.querySelector('svg') : null
          expect(
            !!renamed && renamed !== swapped.before,
            'the fixture really replaced the drawing node',
            renamed ? (renamed === swapped.before ? 'same node' : 'new node') : 'no drawing',
          )
          expect(
            !!renamed &&
              renamed.getAttribute('role') === 'img' &&
              renamed.getAttribute('aria-label') === '图' &&
              renamed.getAttribute('aria-roledescription') === null,
            'a swapped drawing is named again',
            renamed
              ? renamed.getAttribute('role') +
                '|' +
                renamed.getAttribute('aria-label') +
                '|roledesc=' +
                String(renamed.getAttribute('aria-roledescription'))
              : 'no drawing',
          )

          // After the column narrows the engine redraws again — same node swap as
          // above, so the same guarantee has to hold a second time, now that the
          // picture's width has changed. (The fixture cannot make the engine
          // re-layout by itself in headless Chrome; it reproduces the swap the
          // engine performs, which is exactly what the watcher has to survive.)
          resizeStage.style.width = '220px'
          await tick(200)
          const narrowHost = resizeStage.querySelector('.dsh-dyslexia-figure')
          const engineShapedAgain = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
          engineShapedAgain.setAttribute('role', 'graphics-document document')
          engineShapedAgain.setAttribute('aria-roledescription', 'flowchart')
          engineShapedAgain.setAttribute('viewBox', '0 0 220 60')
          engineShapedAgain.setAttribute('width', '220')
          engineShapedAgain.setAttribute('height', '60')
          const narrowBefore = narrowHost ? narrowHost.querySelector('svg') : null
          if (narrowHost) {
            narrowHost.textContent = ''
            narrowHost.appendChild(engineShapedAgain)
          }
          await tick(120)
          const narrowAfter = narrowHost ? narrowHost.querySelector('svg') : null
          expect(
            !!narrowAfter && narrowAfter !== narrowBefore,
            'the fixture replaced the drawing again after the column narrowed',
            narrowAfter ? (narrowAfter === narrowBefore ? 'same node' : 'new node') : 'no drawing',
          )
          expect(
            !!narrowAfter &&
              narrowAfter.getAttribute('role') === 'img' &&
              narrowAfter.getAttribute('aria-label') === '图' &&
              narrowAfter.getAttribute('aria-roledescription') === null,
            'a drawing swapped after a width change is named again',
            narrowAfter
              ? narrowAfter.getAttribute('role') +
                '|' +
                narrowAfter.getAttribute('aria-label') +
                '|roledesc=' +
                String(narrowAfter.getAttribute('aria-roledescription'))
              : 'none',
          )
          resizeRoot.unmount()
          resizeStage.remove()

          /* ---------------- iterables and self-throwing host blocks */
          const hostileChildren = [
            { label: 'an iterable of plain objects', value: { [Symbol.iterator]: function* () { yield { plain: true } } } },
            {
              label: 'a host block that throws while rendering',
              value: React.createElement(function ExplodingBlock() {
                throw new Error('host block exploded')
              }),
            },
          ]
          for (const scenario of hostileChildren) {
            const view = mount(Layer, { code: BAD, streaming: false, children: scenario.value })
            await tick(160)
            const text = view.stage.textContent.trim()
            expect(
              !view.threw && text.length > 0,
              `a hostile host block still leaves the message — ${scenario.label}`,
              view.threw ? String(view.threw).slice(0, 60) : `text=${text.slice(0, 24)}`,
            )
            view.root.unmount()
            view.stage.remove()
          }

          /* ------- the zoom buttons follow a language switch, not the mount */
          const langStage = document.createElement('div')
          langStage.className = 'stage'
          langStage.style.width = '220px'
          document.getElementById('mount').appendChild(langStage)
          const langRoot = ReactDOM.createRoot(langStage)
          document.documentElement.lang = 'zh'
          langRoot.render(React.createElement(Layer, { code: WIDE, streaming: false, children: hostBlock(WIDE) }))
          await tick(200)
          const zoomBeforeSwitch = Array.prototype.slice
            .call(langStage.querySelectorAll('.pele-zoom button, button'))
            .filter((button) => !button.closest('.dsh-dyslexia-bar'))
            .map((button) => button.getAttribute('aria-label') || '')
          expect(
            zoomBeforeSwitch.length > 0 && zoomBeforeSwitch.indexOf('放大') !== -1,
            'the zoom buttons speak the language they were mounted in',
            zoomBeforeSwitch.join(' | '),
          )
          document.documentElement.lang = 'en'
          langRoot.render(React.createElement(Layer, { code: WIDE, streaming: false, children: hostBlock(WIDE) }))
          await tick(300)
          const zoomAfterSwitch = Array.prototype.slice
            .call(langStage.querySelectorAll('.pele-zoom button'))
            .map((button) => button.getAttribute('aria-label') || '')
          const zoomDebug = Array.prototype.slice
            .call(langStage.querySelectorAll('.pele-zoom *, [class*="pele-zoom"]'))
            .map((node) => node.tagName + '.' + node.className + ':' + (node.getAttribute('aria-label') || node.getAttribute('title') || ''))
            .join(' ~ ')
          expect(
            zoomAfterSwitch.length > 0 &&
              zoomAfterSwitch.every((name) => ['Zoom in', 'Zoom out', 'Reset zoom'].indexOf(name) !== -1),
            'the zoom buttons follow the interface language',
            'labels=[' + zoomAfterSwitch.join(' | ') + '] nodes=' + zoomDebug.slice(0, 300),
          )
          langRoot.unmount()
          langStage.remove()
          document.documentElement.lang = 'zh'

          /* -------------------------------------- the copy answer is announced */
          Object.defineProperty(navigator, 'clipboard', {
            configurable: true,
            get() {
              return { writeText: () => Promise.resolve() }
            },
          })
          const announced = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
          await tick(90)
          const announcedButtons = announced.stage.querySelectorAll('button')
          if (announcedButtons[1]) announcedButtons[1].click()
          await tick(80)
          const live = announced.stage.querySelector('[role="status"]')
          expect(!!live && live.getAttribute('aria-live') === 'polite' && live.textContent === '已复制', 'the copy answer is announced, not only coloured', live ? live.textContent : 'no live region')
          announced.root.unmount()
          announced.stage.remove()

          /* ---------------------------- the image, the group, the zoom buttons */
          document.documentElement.lang = 'zh'
          const shaped = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
          await tick(90)
          const group = shaped.stage.querySelector('[role="group"]')
          const image = shaped.stage.querySelector('svg[role="img"]')
          expect(!!group, 'the box around the picture is a group')
          expect(
            !!group && group.getAttribute('aria-label') === null,
            'the box around the picture carries no name of its own',
            group ? String(group.getAttribute('aria-label')) : 'no group',
          )
          expect(!!image, 'the drawing itself is the image')
          // A picture that already fits its column gets no zoom controls: the
          // engine only offers them when the drawing has to be scaled down.
          const quietZoom = Array.prototype.slice
            .call(shaped.stage.querySelectorAll('button'))
            .filter((node) => !node.closest('.dsh-dyslexia-bar'))
          expect(quietZoom.length === 0, 'a picture that fits offers no zoom buttons', String(quietZoom.length))
          shaped.root.unmount()
          shaped.stage.remove()

          // A picture wider than its column is scaled to fit, and the engine then
          // offers its own zoom buttons: they must stay outside the image element
          // and keep the keyboard, or a screen reader user cannot reach them.
          const wideStage = document.createElement('div')
          wideStage.className = 'stage'
          wideStage.style.width = '220px'
          document.getElementById('mount').appendChild(wideStage)
          const wideRoot = ReactDOM.createRoot(wideStage)
          wideRoot.render(React.createElement(Layer, { code: WIDE, streaming: false, children: hostBlock(WIDE) }))
          await tick(160)
          const wideImage = wideStage.querySelector('svg[role="img"]')
          expect(
            !!wideImage && wideImage.getAttribute('aria-label') === '图',
            'the image carries the localised name',
            wideImage ? String(wideImage.getAttribute('aria-label')) : 'no image',
          )
          expect(
            !!wideImage && !wideImage.hasAttribute('aria-roledescription'),
            'the image carries no english role description',
            wideImage && wideImage.hasAttribute('aria-roledescription')
              ? String(wideImage.getAttribute('aria-roledescription'))
              : 'absent',
          )
          expect(
            wideStage.querySelectorAll('[role="img"]').length === 1,
            'exactly one image in the picture',
            String(wideStage.querySelectorAll('[role="img"]').length),
          )
          const zoomButtons = Array.prototype.slice
            .call(wideStage.querySelectorAll('button'))
            .filter((node) => !node.closest('.dsh-dyslexia-bar'))
          expect(zoomButtons.length > 0, 'a scaled picture offers the engine zoom buttons', String(zoomButtons.length))
          const zoomInsideImage = zoomButtons.filter((node) => wideImage && wideImage.contains(node))
          expect(zoomInsideImage.length === 0, 'the zoom buttons sit outside the image', String(zoomInsideImage.length))
          const zoomNames = zoomButtons.map((node) => node.getAttribute('aria-label') || node.textContent || '')
          const untranslatedZoom = zoomNames.filter((name) => /Zoom|Reset/i.test(name))
          expect(zoomNames.length > 0 && untranslatedZoom.length === 0, 'the zoom buttons speak the interface language', zoomNames.join(' | '))
          const reachable = zoomButtons.filter(
            (node) => node.disabled !== true && node.offsetParent !== null && node.getClientRects().length > 0,
          )
          const tabbable = reachable.filter((node) => node.getAttribute('tabindex') !== '-1')
          expect(
            reachable.length > 0 && tabbable.length === reachable.length,
            'every zoom button in reach can take the keyboard',
            `${tabbable.length}/${reachable.length} reachable of ${zoomButtons.length}`,
          )
          // At first only zoom-in is enabled: the other two appear once the
          // picture is scaled, and they have to be just as reachable then.
          if (reachable.length > 0) {
            reachable[0].click()
            await tick(150)
            const zoomed = Array.prototype.slice
              .call(wideStage.querySelectorAll('button'))
              .filter((node) => !node.closest('.dsh-dyslexia-bar'))
            const zoomedReachable = zoomed.filter(
              (node) => node.disabled !== true && node.offsetParent !== null && node.getClientRects().length > 0,
            )
            const zoomedTabbable = zoomedReachable.filter((node) => node.getAttribute('tabindex') !== '-1')
            expect(
              zoomed.length > 1 && zoomedReachable.length === zoomed.length && zoomedTabbable.length === zoomed.length,
              'every zoom button is reachable once the picture is zoomed',
              `${zoomedTabbable.length}/${zoomed.length} after zoom`,
            )
          }
          wideRoot.unmount()
          wideStage.remove()
        } catch (error) {
          bad('fixture aborted', String(error && error.stack ? error.stack.split('\n')[0] : error))
        }

        const failed = results.filter((entry) => entry[0] === 'bad').length
        const passed = results.length - failed
        document.getElementById('log').textContent = results.map((entry) => `[${entry[0]}] ${entry[1]}`).join('\n')
        document.documentElement.setAttribute('data-dsh-checks', `ok:${passed}/failed:${failed}`)
      })()
    </script>
  </body>
</html>
