        const BAD = 'flowchart TD\n  A-->'
        const WIDE = 'flowchart LR\n  A[aaaaaaaaaaaaaaaaaaaa] --> B[bbbbbbbbbbbbbbbbbbbb]\n  B --> C[cccccccccccccccccccc]'

        const tick = (ms) => new Promise((resolve) => setTimeout(resolve, typeof ms === 'number' ? ms : 40))

        function ok(name, detail) {

        // A stand-in host that behaves like cordis 4.1: whatever an effect setup
        // (or a locale/slot registration) returns is a disposer, and stopping the
        // fiber runs them in reverse. Without that, a fixture can never show
        // whether the plugin cleans up after itself.
        // The two slots this plugin touches. `slots.inject(ownerKey, fn)` runs
        // `fn` only while the host has that slot's owner declaration; a wrong
        // key therefore leaves the row pending forever, with no error anywhere.
        // The fake host below mirrors that: an unknown key never fires.
        const SLOT_NAMES = ['conversation.chat.markdown.fence', 'settings.section']

        function makeContext(options) {
          const defs = []
          const injectedSlots = []
          const disposers = []
          const calls = { effects: 0, layersDropped: 0, stringsDropped: 0 }
          const pendingInjections = []
          const slots = {
            register(def, component) {
              if (options && options.rejectLocale && def && def.locale) throw new Error('host rejects locale')
              defs.push({ def, component })
              return () => {
                const index = defs.findIndex((entry) => entry.component === component)
                if (index !== -1) defs.splice(index, 1)
                calls.layersDropped += 1
              }
            },
            inject(name, fn) {
              injectedSlots.push(name)
              const disposer = SLOT_NAMES.indexOf(name) === -1 ? null : fn()
              const drop = () => {
                if (typeof disposer === 'function') disposer()
              }
              disposers.push(drop)
              return drop
            },
          }
          const ctx = {
            slots,
            inject(names, callback) {
              const list = Array.isArray(names) ? names : [names]
              const ready = list.every((name) => ctx[name] !== undefined && ctx[name] !== null)
              if (!ready) {
                pendingInjections.push({ names: list, callback })
                return () => undefined
              }
              callback(Object.create(ctx))
              return () => undefined
            },
            effect(fn) {
              calls.effects += 1
              const disposer = fn()
              const drop = () => {
                if (typeof disposer === 'function') disposer()
              }
              disposers.push(drop)
              return drop
            },
          }
          if (!(options && options.noLocale)) {
            ctx.locale = {
              register() {
                return () => {
                  calls.stringsDropped += 1
                }
              },
            }
          }
          return {
            ctx,
            defs,
            calls,
            injectedSlots,
            provide(name, value) {
              ctx[name] = value
              for (let index = pendingInjections.length - 1; index >= 0; index -= 1) {
                const entry = pendingInjections[index]
                const ready = entry.names.every((dep) => ctx[dep] !== undefined && ctx[dep] !== null)
                if (!ready) continue
                pendingInjections.splice(index, 1)
                entry.callback(Object.create(ctx))
              }
            },
            dispose() {
              while (disposers.length > 0) disposers.pop()()
            },
          }
        }

          stage.className = 'stage'
          document.getElementById('mount').appendChild(stage)
          const root = ReactDOM.createRoot(stage)
          let threw = null

        // The client reports what it had to drop on `console.warn`. A lean host
        // (no slots, no configForms, no face) is an expected shape, not a fault,
        // so dropping a surface there must be silent; a guard that disappears

        function captureWarnings(run) {

          const original = console.warn
          console.warn = function () {
            seen.push(Array.prototype.map.call(arguments, (part) => String(part)).join(' '))

        /* ---------------------------------------- colours a reader can see */
        // Every claim below is a ratio computed the way WCAG computes it. The
        // fixture carries the host's own colours now, so "did the picture get
        // easier to read" is a number, not an opinion. Chrome reports the
        // result of `color-mix()` as `color(srgb ...)`, hence both spellings.
        function cssColour(text) {
          if (text === undefined || text === null) return null

          const rgba = /^rgba?\(([^)]*)\)$/.exec(value)

            if (parts.length < 3) return null
            const channel = (part) => (part.indexOf('%') !== -1 ? parseFloat(part) / 100 : parseFloat(part) / 255)
            const alpha = parts.length > 3 ? (parts[3].indexOf('%') !== -1 ? parseFloat(parts[3]) / 100 : parseFloat(parts[3])) : 1
            const colour = { r: channel(parts[0]), g: channel(parts[1]), b: channel(parts[2]), a: alpha }
            if (isNaN(colour.r) || isNaN(colour.g) || isNaN(colour.b)) return null
            return colour
          }
          const srgb = /^color\(\s*srgb\s+([-\d.e]+)\s+([-\d.e]+)\s+([-\d.e]+)\s*(?:\/\s*([-\d.e]+%?))?\s*\)$/.exec(value)
          if (srgb) {
            const alpha = srgb[4] === undefined ? 1 : (srgb[4].indexOf('%') !== -1 ? parseFloat(srgb[4]) / 100 : parseFloat(srgb[4]))

          }

        // visible as what it makes with the surface under it.
        function layered(front, back) {
          if (!front) return null
          if (front.a >= 1) return front
          const canvas = back || { r: 1, g: 1, b: 1, a: 1 }
          const alpha = front.a
          return {
            r: front.r * alpha + canvas.r * (1 - alpha),
            g: front.g * alpha + canvas.g * (1 - alpha),
            b: front.b * alpha + canvas.b * (1 - alpha),
            a: 1,

          const channel = (part) => (part <= 0.03928 ? part / 12.92 : Math.pow((part + 0.055) / 1.055, 2.4))
          return 0.2126 * channel(colour.r) + 0.7152 * channel(colour.g) + 0.0722 * channel(colour.b)
        }

          const back = cssColour(backText)
          const front = layered(cssColour(frontText), back)
          if (!front || !back) return null
          const frontLum = relativeLuminance(front)
          const backLum = relativeLuminance(back)
          return (Math.max(frontLum, backLum) + 0.05) / (Math.min(frontLum, backLum) + 0.05)

          const colour = cssColour(text)
          if (!colour) return null
          const max = Math.max(colour.r, colour.g, colour.b)
          const min = Math.min(colour.r, colour.g, colour.b)
          const delta = max - min
          if (delta === 0) return 0
          let hue
          if (max === colour.r) hue = ((colour.g - colour.b) / delta) % 6
          else if (max === colour.g) hue = (colour.b - colour.r) / delta + 2

          hue *= 60
          return hue < 0 ? hue + 360 : hue

        // instead of waiting for someone to notice a grey box.
        const SHAPE_ROLES = {
          'start-end': ['stadium','circle','odd','sm-circ','fr-circ','dbl-circ','cross-circ','f-circ'],
          decision: ['diam','hex','bang'],
          data: ['cyl','datastore','folder','bucket','doc','docs','lin-doc','tag-doc','tag-rect','st-rect','win-pane'],
          io: ['lean-r','lean-l','trap-b','trap-t','curv-trap','person','browser','cloud'],
          process: ['rect','rounded','fr-rect','notch-rect','lin-rect','console','delay','div-rect','tri','flip-tri','sl-rect','bow-rect','brace','brace-r','braces','bolt','fork','hourglass','h-cyl','lin-cyl','notch-pent','flag','text'],
        }
        // The same assignment for the diagrams that name their nodes after
        // what they are instead of after a shape.
        const NODE_ROLES = {
          'start-end': ['pele-state-start', 'pele-state-end'],
          data: ['pele-state', 'pele-class', 'pele-entity', 'pele-actor-participant', 'pele-card', 'pele-requirement', 'pele-service', 'pele-wardley-component', 'pele-task'],
          io: ['pele-c4-person'],
          process: ['pele-c4-system'],
        }
        const roleOfNode = (classes) => {
          let role = null
          for (let index = 0; index < classes.length; index += 1) {
            const token = classes[index]
            if (token.indexOf('pele-shape-') === 0) {
              const shape = token.slice('pele-shape-'.length)
              Object.keys(SHAPE_ROLES).forEach((name) => {
                if (SHAPE_ROLES[name].indexOf(shape) >= 0) role = name
              })
              continue
            }
            Object.keys(NODE_ROLES).forEach((name) => {
              if (NODE_ROLES[name].indexOf(token) >= 0) role = name
            })
          }
          return role
        }
        const SHAPES = Object.keys(SHAPE_ROLES).reduce((all, role) => all.concat(SHAPE_ROLES[role]), [])
        const SHAPE_CODE = 'flowchart LR\n' + SHAPES.map((shape, at) => 'S' + at + '@{ shape: ' + shape + ', label: "' + shape + '" }').join('\n')

        // A node the engine paints is the thing a diagram is about; if the
        // engine grows a kind of node the plugin has no rule for, the reader
        // gets a grey box. Tokens that only group or frame are listed here.
        const UNCOLOURED_NODE_TOKENS = ['pele-node', 'pele-nodes', 'pele-section']
        const seenNodeTokens = new Set()
        // The surface a shape or a word is actually seen against: the nearest
        // painted ancestor. `color-mix()` channels arrive as 0–1 already.
        function surfaceAt(node) {
          for (let step = node; step; step = step.parentElement) {
            const colour = cssColour(styleValue(step, 'backgroundColor'))
            if (colour && colour.a > 0) return layered(colour, { r: 1, g: 1, b: 1, a: 1 })
          }
          return { r: 1, g: 1, b: 1, a: 1 }
        }

        function ratioBetween(front, back) {
          const painted = layered(front, back)
          const ONE = relativeLuminance(painted)
          const TWO = relativeLuminance(back)
          return (Math.max(ONE, TWO) + 0.05) / (Math.min(ONE, TWO) + 0.05)
        }

        // A label sits on the shape its own group drew, and the engine may
        // paint that shape faintly (`fill-opacity`), so the fill is composited
        // over what is behind it before the ink is judged.
        function paintBehind(textNode) {
          let behind = null
          for (let group = textNode.parentElement; group && group.tagName.toLowerCase() === 'g'; group = group.parentElement) {
            const shapes = group.querySelectorAll(':scope > rect, :scope > path, :scope > polygon, :scope > circle, :scope > ellipse, :scope > polyline')
            for (let index = 0; index < shapes.length; index += 1) {
              const shape = shapes[index]
              if (shape.contains(textNode)) continue
              const fill = cssColour(styleValue(shape, 'fill'))
              if (!fill || fill.a <= 0) continue
              const raw = shape.getAttribute('fill-opacity')
              const opacity = raw === null ? 1 : parseFloat(raw)
              // An arrow head is painted on top of nothing: the label sits on
              // the last shape drawn under it, which is the box itself.
              behind = { fill: fill, opacity: isNaN(opacity) ? 1 : opacity, group: group }
            }
            if (behind) {
              const faint = { r: behind.fill.r, g: behind.fill.g, b: behind.fill.b, a: behind.fill.a * behind.opacity }
              return layered(faint, surfaceAt(behind.group))
            }
          }
          // A treemap leaf writes its label in a group of its own, beside the
          // tile it belongs to: the tile is the background even then.
          const tile = textNode.closest ? textNode.closest('.pele-leaf, .pele-series, .pele-section') : null
          if (tile) {
            const painted = tile.querySelector('rect, polygon, circle, path, ellipse')
            const fill = painted ? cssColour(styleValue(painted, 'fill')) : null
            if (fill && fill.a > 0) {
              const raw = painted.getAttribute('fill-opacity')
              const opacity = raw === null ? 1 : parseFloat(raw)
              return layered({ r: fill.r, g: fill.g, b: fill.b, a: fill.a * (isNaN(opacity) ? 1 : opacity) }, surfaceAt(tile))
            }
          }
          return null
        }

        // One measurement of one picture, under whichever theme is on <body>.
        function measurePalette(stage) {
          const figure = stage.querySelector('.dsh-dyslexia-figure')
          const canvas = figure ? styleValue(figure, 'backgroundColor') : ''
          const measured = {}
          for (const role of ROLES) {
            const node = figure ? figure.querySelector('.pele-node.pele-shape-' + role.shape) : null
            const shape = node ? node.querySelector('rect, polygon, circle, path, ellipse, polyline') : null
            const text = node ? node.querySelector('text.pele-label') : null
            measured[role.key] = {
              fill: shape ? styleValue(shape, 'fill') : '',
              stroke: shape ? styleValue(shape, 'stroke') : '',
              text: text ? styleValue(text, 'fill') : '',
              count: figure ? figure.querySelectorAll('.pele-node.pele-shape-' + role.shape).length : 0,
            }
          }
          const edges = figure ? figure.querySelector('g.pele-edges') : null
          // Arrowheads are filled with the line colour (`fill="var(--_l)"`)
          // while the line itself is stroked — measure the paint each uses.
          const marker = figure ? figure.querySelector('path.pele-marker') : null
          return {
            figure,
            canvas,
            roles: measured,
            edgeStroke: edges ? styleValue(edges, 'stroke') : '',
            markerFill: marker ? styleValue(marker, 'fill') : '',
            markerStroke: marker ? styleValue(marker, 'stroke') : '',
          }
        }

        function measureAuthored(stage) {
          const figure = stage.querySelector('.dsh-dyslexia-figure')
          const node = figure ? figure.querySelector('.pele-node') : null
          const shape = node ? node.querySelector('rect, polygon, circle, path, ellipse, polyline') : null
          const text = node ? node.querySelector('text.pele-label') : null
          return {
            fill: shape ? styleValue(shape, 'fill') : '',
            stroke: shape ? styleValue(shape, 'stroke') : '',
            text: text ? styleValue(text, 'fill') : '',
          }
        }

        const sameColour = (one, other) => {
          const a = cssColour(one)
          const b = cssColour(other)
          if (!a || !b) return false
          return Math.abs(a.r - b.r) < 0.004 && Math.abs(a.g - b.g) < 0.004 && Math.abs(a.b - b.b) < 0.004 && Math.abs(a.a - b.a) < 0.004
        }

        /* ------------------------------------------------ module and layer */
        try {
          expect(window.__loaderCalls === 1, 'loading client.js registers one factory')
          const module = window.__module
          expect(module && typeof module.apply === 'function', 'the module exposes apply')
          expect(module && Array.isArray(module.inject) && module.inject.join(',') === 'slots', 'the module asks for slots only', String(module && module.inject))
          const { ctx, defs } = makeContext({})
          module.apply(ctx)
          expect(defs.length === 1, 'apply registers exactly one fence layer', 'count ' + defs.length)
          const def = defs[0].def || {}
          expect(def.name === 'conversation.chat.markdown.fence', 'layer sits on the fence slot', def.name)
          expect(def.key === 'mermaid', 'layer is keyed to mermaid', String(def.key))
          expect(def.id === '@jiezhengj/dsh-dyslexia/mermaid', 'layer id', String(def.id))
          expect(def.order === 100, 'layer order', String(def.order))
          expect(def.locale === 'dyslexia', 'layer claims the locale namespace', String(def.locale))
          const Layer = defs[0].component
          window.__layer = Layer

          /* ------------------------------------------------------ languages */
          expect(missingLanguage.length === 0, 'every interface language has expectations', missingLanguage.join(','))
          const seen = {}
          for (const lang of LANGS) {
            document.documentElement.lang = lang
            const view = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
            await tick(80)
            const figure = view.stage.querySelector('[role="img"]')
            const labels = buttonsIn(view.stage)
            const token = (figure && figure.getAttribute('aria-label')) || ''
            const exact = EXACT[lang]
            expect(token === exact.name, `[${lang}] the picture carries a plain name`, token)
            expect(labels[0] === exact.show && labels[1] === exact.copy, `[${lang}] first render shows the two buttons`, labels.join(' | '))
            expect(!!figure, `[${lang}] a picture is drawn`)
            expect(labels.length === 2, `[${lang}] exactly two buttons`, String(labels.length))
            const bare = labels.concat([token]).filter((text) => /copySource|showSource|hideSource|figureLabel|copied|copyFailed/.test(text))
            expect(bare.length === 0, `[${lang}] no internal key reaches the screen`, bare.join(','))
            if (view.stage.querySelector('.dsh-dyslexia-bar button')) {
              const toggle = view.stage.querySelectorAll('button')[0]
              expect(toggle.getAttribute('aria-expanded') === 'false', `[${lang}] the source toggle starts collapsed`)
              toggle.click()
              await tick(30)
              const hiddenLabels = buttonsIn(view.stage)
              expect(hiddenLabels[0] === exact.hidden, `[${lang}] the source toggle flips its word`, hiddenLabels[0])
              expect(toggle.getAttribute('aria-expanded') === 'true', `[${lang}] the source toggle announces itself as expanded`)
              const marker = view.stage.querySelector('.dsh-dyslexia-source code')
              expect(!!marker && /(^| )language-mermaid( |$)/.test(marker.className), `[${lang}] the expanded source keeps its fence language`, marker ? marker.className : 'no marker')
              expect(view.stage.querySelector('[role="presentation"]') !== null, `[${lang}] the mount point is presentational`)
              toggle.click()
              await tick(30)
              expect(toggle.getAttribute('aria-expanded') === 'false', `[${lang}] a second click closes the panel it opened`)
              expect(buttonsIn(view.stage)[0] === exact.show, `[${lang}] the button says show again once closed`, buttonsIn(view.stage)[0])
            } else {
              bad(`[${lang}] the actions bar is missing`)
            }
            const languageClipboard = Object.getOwnPropertyDescriptor(navigator, 'clipboard')
            Object.defineProperty(navigator, 'clipboard', {
              configurable: true,
              value: { writeText: () => Promise.resolve() },
            })
            const copyNode = view.stage.querySelectorAll('button')[1]
            if (copyNode) copyNode.click()
            await tick(40)
            const spoken = view.stage.querySelector('[role="status"]')
            expect(
              spoken !== null && spoken.textContent === exact.copied,
              `[${lang}] the copy answer is announced in words`,
              (spoken ? spoken.textContent : 'no status') + ' / expected ' + exact.copied,
            )
            const spokenBox = spoken !== null ? getComputedStyle(spoken) : null
            const spokenVisible = spoken !== null && spokenBox.display !== 'none' && spoken.getClientRects().length > 0
            expect(
              spokenVisible && spokenBox !== null && parseFloat(spokenBox.fontSize) === 12,
              `[${lang}] the copy answer can be read, not only heard`,
              (spokenBox ? spokenBox.fontSize + ' / ' + spokenBox.color : 'no status'),
            )
            Object.defineProperty(navigator, 'clipboard', {
              configurable: true,
              value: { writeText: () => Promise.reject(new Error('denied by the harness')) },
            })
            if (copyNode) copyNode.click()
            await tick(40)
            const refused = view.stage.querySelector('[role="status"]')
            expect(
              refused !== null && refused.textContent === exact.failed,
              `[${lang}] a refused clipboard says so`,
              (refused ? refused.textContent : 'no status') + ' / expected ' + exact.failed,
            )
            if (languageClipboard) Object.defineProperty(navigator, 'clipboard', languageClipboard)
            else delete navigator.clipboard
            seen[lang] = token + '|' + labels.join('|')
            view.root.unmount()
            view.stage.remove()
          }
          const en = seen.en
          const untranslated = LANGS.filter((lang) => lang !== 'en' && seen[lang] === en)
          expect(untranslated.length === 0, 'every interface language actually translates', untranslated.join(','))
          // A host language this plugin does not speak falls back to english.
          // Defaulting to a neighbour language stayed green until now.
          const previousLang = document.documentElement.lang
          document.documentElement.lang = 'zz'
          const unknownLanguage = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
          await tick(90)
          const unknownButtons = buttonsIn(unknownLanguage.stage)
          expect(
            unknownButtons.indexOf(EXACT.en.copy) !== -1 && unknownButtons.indexOf(EXACT.en.show) !== -1,
            'a language the plugin does not speak falls back to english',
            JSON.stringify(unknownButtons),
          )
          unknownLanguage.root.unmount()
          unknownLanguage.stage.remove()
          document.documentElement.lang = previousLang

          /* ------------------------------- the fence language comes from the host */
          const otherFence = mount(Layer, { code: CODE, lang: 'mmd', streaming: false, children: hostBlock(CODE) })
          await tick(90)
          const otherToggle = otherFence.stage.querySelector('.dsh-dyslexia-bar button')
          if (otherToggle) {
            otherToggle.click()
            await tick(30)
            const otherMarker = otherFence.stage.querySelector('.dsh-dyslexia-source code')
            expect(
              !!otherMarker && /(^| )language-mmd( |$)/.test(otherMarker.className),
              'the source block keeps the language the host sent',
              otherMarker ? otherMarker.className : 'no marker',
            )
          } else {
            expect(false, 'the source block keeps the language the host sent', 'no source toggle')
          }
          otherFence.root.unmount()
          otherFence.stage.remove()

          /* ------------------------------------------------- host translate */
          document.documentElement.lang = 'zh'
          const hostVariants = [
            ['echoes the key', (key) => key, 'key echo'],
            ['throws', () => {
              throw new Error('locale service changed')
            }, 'throwing t'],
            ['answers blanks', () => '   ', 'blank answer'],
            ['echoes key with a value', (key) => key + ':value', 'key echo with value'],
            ['leaves a placeholder', () => '{{missing}}', 'unfilled placeholder'],
          ]
          for (const [label, t, tag] of hostVariants) {
            const view = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE), t })
            await tick(60)
            const labels = buttonsIn(view.stage)
            const token = (view.stage.querySelector('[role="img"]') || { getAttribute: () => '' }).getAttribute('aria-label')
            expect(labels[0] === '查看源码' && labels[1] === '复制源码' && token === '图', `a host t that ${label} still shows words`, labels.join(' | ') + ' / ' + token)
            view.root.unmount()
            view.stage.remove()
          }

          /* ---------------------------------------------------- host props */
          const streamingTrue = mount(Layer, { code: CODE, streaming: true, children: hostBlock(CODE) })
          await tick(50)
          expect(!streamingTrue.stage.querySelector('[role="img"]') && streamingTrue.stage.textContent.indexOf(CODE) !== -1, 'a streaming fence shows only the host block')
          streamingTrue.root.unmount()
          streamingTrue.stage.remove()

          const streamingOne = mount(Layer, { code: CODE, streaming: 1, children: hostBlock(CODE) })
          await tick(50)
          expect(!streamingOne.stage.querySelector('[role="img"]'), 'a truthy streaming flag is honoured')
          streamingOne.root.unmount()
          streamingOne.stage.remove()

          const codeGetter = { streaming: false, children: hostBlock(CODE) }
          Object.defineProperty(codeGetter, 'code', {
            enumerable: true,
            get() {
              throw new Error('code getter exploded')
            },
          })
          let codeGetterView = null
          try {
            // The element is built with plain props first, then its frozen props
            // bag is turned hostile — this is how a host upgrade would hand a
            // getter to the layer without React copying it at creation time.
            const stage = document.createElement('div')
            stage.className = 'stage'
            document.getElementById('mount').appendChild(stage)
            const root = ReactDOM.createRoot(stage)
            const element = React.createElement(Layer, { streaming: false, children: hostBlock(CODE) })
            Object.defineProperty(element.props, 'code', {
              enumerable: true,
              get() {
                throw new Error('code getter exploded')
              },
            })
            root.render(element)
            codeGetterView = { stage, root }
          } catch (error) {
            codeGetterView = { stage: null, root: null, error }
          }
          await tick(60)
          // React 18 renders in the background, so nothing thrown inside work
          // reaches the call site: asserting "did not throw" here would be
          // tautological. The falsifiable version calls the layer's own render,
          // which is synchronous, with the same hostile props bag.
          let codeGetterRendered = null
          let codeGetterCaught = null
          try {
            const hostileCode = { streaming: false, children: hostBlock(CODE) }
            Object.defineProperty(hostileCode, 'code', {
              enumerable: true,
              get() {
                throw new Error('code getter exploded')
              },
            })
            codeGetterRendered = new Layer(hostileCode).render()
          } catch (error) {
            codeGetterCaught = error
          }
          expect(codeGetterCaught === null, 'the layer survives a throwing code getter', codeGetterCaught ? String(codeGetterCaught.message) : '')
          expect(codeGetterRendered !== null && typeof codeGetterRendered === 'object', 'a throwing code getter still yields an element')
          expect(!!codeGetterView && codeGetterView.stage.textContent.indexOf(CODE) !== -1, 'a throwing code getter leaves the host block', codeGetterView ? JSON.stringify(codeGetterView.stage.textContent.slice(0, 40)) : 'no view')
          if (codeGetterView) {
            codeGetterView.root.unmount()
            codeGetterView.stage.remove()
          }

          const childrenGetter = { code: CODE, streaming: false }
          let childrenView = null
          let childrenSetupError = null
          try {
            const stage = document.createElement('div')
            stage.className = 'stage'
            document.getElementById('mount').appendChild(stage)
            const root = ReactDOM.createRoot(stage)
            const element = React.createElement(Layer, { code: CODE, streaming: false })
            Object.defineProperty(element.props, 'children', {
              enumerable: true,
              get() {
                throw new Error('children getter exploded')
              },
            })
            root.render(element)
            childrenView = { stage, root }
          } catch (error) {
            childrenSetupError = error
          }
          await tick(80)
          // React 18 renders asynchronously, so a throw inside work never reaches
          // this try block: what must be asserted is the visible outcome, not the
          // absence of an exception here. A host block we cannot even read must
          // still leave the reader its source text.
          let childrenGetterRendered = null
          let childrenGetterCaught = null
          try {
            const hostileChildren = { code: CODE, streaming: false }
            Object.defineProperty(hostileChildren, 'children', {
              enumerable: true,
              get() {
                throw new Error('children getter exploded')
              },
            })
            childrenGetterRendered = new Layer(hostileChildren).render()
          } catch (error) {
            childrenGetterCaught = error
          }
          expect(
            childrenSetupError === null && !!childrenView && childrenView.stage.childNodes.length > 0,
            'the hostile children bag mounted without a setup error',
            childrenSetupError ? String(childrenSetupError.message) : childrenView ? `nodes=${childrenView.stage.childNodes.length}` : 'no view',
          )
          expect(childrenGetterCaught === null, 'the layer survives a throwing children getter', childrenGetterCaught ? String(childrenGetterCaught.message) : '')
          expect(childrenGetterRendered !== null && typeof childrenGetterRendered === 'object', 'a throwing children getter still yields an element')
          expect(
            !!childrenView && childrenView.stage.textContent.indexOf(CODE) !== -1,
            'a throwing children getter leaves the source',
            childrenView ? JSON.stringify(childrenView.stage.textContent.slice(0, 40)) : 'no view',
          )
          if (childrenView) {
            childrenView.root.unmount()
            childrenView.stage.remove()
          }

          // A Proxy is the same hazard from the other side: reading the value does
          // not throw, the trap does. Whatever the props bag does, this fence may
          // lose its picture — the message around it may not be emptied.
          const proxyStage = document.createElement('div')
          proxyStage.className = 'stage'
          document.getElementById('mount').appendChild(proxyStage)
          const proxyRoot = ReactDOM.createRoot(proxyStage)
          const proxyElement = React.createElement(Layer, { code: CODE, streaming: false })
          Object.defineProperty(proxyElement.props, 'children', {
            enumerable: true,
            get() {
              return new Proxy(
                {},
                {
                  get() {
                    throw new Error('hostile get')
                  },
                  has() {
                    throw new Error('hostile has')
                  },
                },
              )
            },
          })
          proxyRoot.render(proxyElement)
          await tick(90)
          expect(
            proxyStage.textContent.indexOf(CODE) !== -1,
            'a fence whose props read throws is left to the host, not the message',
            JSON.stringify(proxyStage.textContent.slice(0, 40)),
          )
          proxyRoot.unmount()
          proxyStage.remove()

          const stringCode = mount(Layer, { code: 42, streaming: false, children: hostBlock('fallback') })
          await tick(50)
          expect(stringCode.stage.textContent.indexOf('fallback') !== -1 && !stringCode.stage.querySelector('[role="img"]'), 'a non-string fence is left to the host')
          stringCode.root.unmount()
          stringCode.stage.remove()

          /* -------------------------------------------------- draw failures */
          const broken = mount(Layer, { code: BAD, streaming: false, children: hostBlock(BAD) })
          await tick(80)
          const brokenNote = broken.stage.querySelector('.dsh-dyslexia-note')
          expect(!!brokenNote, 'a broken diagram says why')
          expect(brokenNote ? /源码/.test(brokenNote.textContent) : false, 'the reason is a complete sentence', brokenNote ? brokenNote.textContent : '')
          expect(brokenNote ? /Parse error/.test(brokenNote.textContent) === false : false, 'the engine English is not pasted into the sentence')
          expect(broken.stage.textContent.indexOf(BAD) !== -1, 'a broken diagram keeps the host block')
          broken.root.unmount()
          broken.stage.remove()

          const orphan = mount(Layer, { code: BAD, streaming: false })
          await tick(80)
          expect(orphan.stage.textContent.indexOf(BAD) !== -1, 'a broken diagram without host children still shows its source')
          orphan.root.unmount()
          // A fence that failed is retried when the host hands over new source.
          // Without the retry one bad edit left the message failed for good.
          const recoveryStage = document.createElement('div')
          recoveryStage.className = 'stage'
          document.getElementById('mount').appendChild(recoveryStage)
          const recoveryRoot = ReactDOM.createRoot(recoveryStage)
          recoveryRoot.render(React.createElement(Layer, { code: BAD, streaming: false, children: hostBlock(BAD) }))
          await tick(80)
          expect(!!recoveryStage.querySelector('.dsh-dyslexia-note'), 'a failed fence says why before it is fixed')
          recoveryRoot.render(React.createElement(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) }))
          await tick(140)
          expect(
            !!recoveryStage.querySelector('.dsh-dyslexia-figure svg') && !recoveryStage.querySelector('.dsh-dyslexia-note'),
            'a fence that failed draws again when its source changes',
            recoveryStage.textContent.slice(0, 40),
          )
          recoveryRoot.unmount()
          recoveryStage.remove()
          orphan.stage.remove()

          const htmlDescriptor = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML')
          let armed = true
          Object.defineProperty(Element.prototype, 'innerHTML', {
            configurable: true,
            get() {
              return htmlDescriptor.get.call(this)
            },
            set(value) {
              if (armed) throw new Error('html assignment exploded')
              htmlDescriptor.set.call(this, value)
            },
          })
          let drawThrowView = null
          try {
            drawThrowView = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
          } catch (error) {
            void error
          }
          await tick(120)
          armed = false
          Object.defineProperty(Element.prototype, 'innerHTML', htmlDescriptor)
          if (drawThrowView) {
            expect(!!drawThrowView.stage.querySelector('.dsh-dyslexia-note'), 'a throwing engine leaves a sentence')
            expect(drawThrowView.stage.textContent.indexOf(CODE) !== -1, 'a throwing engine keeps the host block')
            const throwNote = drawThrowView.stage.querySelector('.dsh-dyslexia-note')
            // A broken diagram and a failed engine are different accidents and
            // must not read as the same sentence; collapsing them stayed green.
            expect(
              !!brokenNote && !!throwNote ? brokenNote.textContent !== throwNote.textContent : false,
              'a syntax error and a failed engine get different sentences',
              `syntax=${brokenNote ? brokenNote.textContent : 'none'} engine=${throwNote ? throwNote.textContent : 'none'}`,
            )
            drawThrowView.root.unmount()
            drawThrowView.stage.remove()
          } else {
            bad('a throwing engine leaves a sentence', 'the layer did not render at all')
          }

          /* ------------------------------------- a new source, a new picture */
          // The fence is re-rendered in place when its text changes. A panel the
          // reader opened must fold away, and a "Copied" answer must not outlive
          // the text it described — otherwise a broken replacement shows the same
          // source twice, once as a panel and once as the host's own block.
          const swappedView = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
          await tick(80)
          const swappedFirst = swappedView.stage.querySelectorAll('button')[0]

          const nextSourceView = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })

          nextSourceView.root.unmount()

          const answerView = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
          await tick(80)
          const answerClipboardBackup = navigator.clipboard
          Object.defineProperty(navigator, 'clipboard', {

          if (answerButtons.length > 1) answerView.stage.querySelectorAll('button')[1].click()
          await tick(60)
          const answered = answerView.stage.querySelector('[role="status"]')

          answerView.root.render(

          await tick(40)

          expect(

          )

          noClipboard.stage.remove()

          Object.defineProperty(navigator, 'clipboard', {
            configurable: true,

          /* ------------- a host dictionary that already owns the word `copied` */
          {

            // for the whole window and its own copy buttons own `copied`, so a
            // bare-key lookup showed the host's wording on this plugin's button.
            const collidedClipboard = navigator.clipboard

            const collided = mount(Layer, {

            await tick(60)
            const collidedButtons = collided.stage.querySelectorAll('button')
            if (collidedButtons[1]) collidedButtons[1].click()
            await tick(60)

            expect(
              collidedStatus !== null && collidedStatus.textContent === '已复制',

              collidedStatus ? collidedStatus.textContent : 'none',

            collided.root.unmount()
            collided.stage.remove()
            Object.defineProperty(navigator, 'clipboard', { configurable: true, value: collidedClipboard })

          /* --------- a host that really translates the namespaced key is used */
          {
            const namespacedClipboard = navigator.clipboard
            Object.defineProperty(navigator, 'clipboard', {
              configurable: true,
              value: { writeText() { return Promise.resolve() } },
            })
            const namespaced = mount(Layer, {
              code: CODE,
              streaming: false,
              children: hostBlock(CODE),
              t: (key) => (key === 'dyslexia.copied' ? 'HOST COPIED' : key),
            })
            await tick(60)
            const namespacedButtons = namespaced.stage.querySelectorAll('button')
            if (namespacedButtons[1]) namespacedButtons[1].click()
            await tick(60)
            const namespacedStatus = namespaced.stage.querySelector('[role="status"]')
            expect(
              namespacedStatus !== null && namespacedStatus.textContent === 'HOST COPIED',
              'a host that translates the namespaced key is used',
              namespacedStatus ? namespacedStatus.textContent : 'none',
            )
            namespaced.root.unmount()
            namespaced.stage.remove()
            Object.defineProperty(navigator, 'clipboard', { configurable: true, value: namespacedClipboard })
          }

          /* ------------------------------------------- a message with more than one fence */
          {
            const message = document.createElement('div')
            message.setAttribute('data-message', 'keep')
            const before = document.createElement('p')
            before.textContent = 'Before the first diagram the message keeps its words.'
            const between = document.createElement('p')
            between.textContent = 'Between the two diagrams the message keeps its words.'
            const after = document.createElement('p')
            after.textContent = 'After the second diagram the message keeps its words.'
            const firstHost = document.createElement('div')
            const secondHost = document.createElement('div')
            message.appendChild(before)
            message.appendChild(firstHost)
            message.appendChild(between)
            message.appendChild(secondHost)
            message.appendChild(after)

            const secondRoot = ReactDOM.createRoot(secondHost)
            firstRoot.render(React.createElement(Layer, { code: 'flowchart LR\n  A --> B', streaming: false, children: hostBlock('first') }))
            secondRoot.render(React.createElement(Layer, { code: 'sequenceDiagram\n  A->>B: hi', streaming: false, children: hostBlock('second') }))
            await tick(160)
            const figures = message.querySelectorAll('[role="img"]')
            const prose = message.querySelectorAll('p')
            const secondFigure = secondHost.querySelectorAll('[role="img"]')
            expect(figures.length === 2, 'two fences draw two pictures', `${figures.length}`)
            expect(secondFigure.length === 1, 'the second fence draws its own picture', `${secondFigure.length}`)
            expect(
              prose.length === 3 && prose[0].textContent.indexOf('Before') === 0 && prose[2].textContent.indexOf('After') === 0,
              'the prose around a picture is left alone',
              `${prose.length}`,
            )
            const order = Array.from(message.children).map((node) => (node.querySelector && node.querySelector('[role="img"]') ? 'figure' : node.tagName.toLowerCase()))
            expect(order.join(',') === 'p,figure,p,figure,p', 'the picture and the prose keep their order', order.join(','))
            firstRoot.unmount()
            secondRoot.unmount()
            message.remove()

          /* --------------------------------------------------- narrow screen */
          const narrow = mount(Layer, { code: 'flowchart LR\n' + Array.from({ length: 16 }, (_, index) => `  N${index} --> N${index + 1}`).join('\n'), streaming: false, children: hostBlock('wide') })
          await tick(120)
          const narrowFigure = narrow.stage.querySelector('.dsh-dyslexia-figure')
          const stageWidth = narrow.stage.clientWidth
          // A control that proves this harness can measure an overflow at all: an
          // unconstrained box wider than the column must make the stage scroll.
          const probe = document.createElement('div')
          probe.setAttribute('data-probe', 'overflow')
          probe.style.cssText = 'width:4000px;height:2px'
          narrow.stage.appendChild(probe)
          expect(narrow.stage.scrollWidth > stageWidth + 100, 'the column measurement can see an overflow', narrow.stage.scrollWidth + '/' + stageWidth)
          probe.remove()
          expect(narrow.stage.scrollWidth <= stageWidth + 1, 'the column goes back to fitting once the control is gone', narrow.stage.scrollWidth + '/' + stageWidth)
          expect(!!narrowFigure && Math.abs(narrowFigure.clientWidth - stageWidth) <= 8, 'the picture takes the column width', (narrowFigure ? narrowFigure.clientWidth : 0) + '/' + stageWidth)
          expect(narrow.stage.scrollWidth <= stageWidth + 1, 'a wide picture does not widen the column', narrow.stage.scrollWidth + '/' + stageWidth)
          const pageOverflow = document.documentElement.scrollWidth - document.documentElement.clientWidth
          expect(pageOverflow <= 1, 'the page itself never overflows', String(pageOverflow))
          // The engine adapts itself, but the column cap and the inner scroll are
          // ours: with the stylesheet gone the box would grow and the page would
          // scroll sideways instead.
          const figureBox = narrowFigure ? getComputedStyle(narrowFigure) : null
          expect(figureBox !== null && figureBox.maxWidth === '100%', 'the picture box is capped to the column', figureBox ? figureBox.maxWidth : 'no box')
          expect(figureBox !== null && figureBox.boxSizing === 'border-box', 'the picture box counts its own padding', figureBox ? figureBox.boxSizing : 'no box')
          expect(figureBox !== null && figureBox.overflowX === 'auto', 'a wide picture scrolls inside its own box', figureBox ? figureBox.overflowX : 'no box')

          /* --------------------------------------------------------- theme */
          const themed = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
          await tick(90)
          const themedText = themed.stage.querySelector('svg[role="img"] text')
          const firstFill = themedText ? getComputedStyle(themedText).fill : ''
          themed.stage.style.setProperty('--dsw-alias-label-primary', 'rgb(1, 2, 3)')
          await tick(60)
          const secondText = themed.stage.querySelector('svg[role="img"] text')
          const secondFill = secondText ? getComputedStyle(secondText).fill : ''
          expect(!!themedText && !!secondText, 'a drawn picture has text to colour')
          expect(firstFill !== '' && firstFill !== secondFill, 'the picture follows the host colour without reloading', firstFill + ' -> ' + secondFill)
          themed.root.unmount()
          themed.stage.remove()
          narrow.root.unmount()
          narrow.stage.remove()

          /* --------------------------- is the picture readable? (003) */
          // The three P1 stories of feature 003 are numbers here: lines at
          // 3:1 or better, text at 7:1, and five roles told apart by four hues
          // plus one neutral step. The fixture carries the host's own colours,
          // so this measures what a reader sees — and the negative check at the
          // end proves these assertions can fail at all. Before 003 the fixture
          // had friendlier colours than the host and 325 checks stayed green
          // while diagrams were drawn white on white.
          async function palettePass(theme) {
            const view = mount(Layer, { code: PALETTE_CODE, streaming: false, children: hostBlock(PALETTE_CODE) })
            await tick(180)
            const shot = measurePalette(view.stage)
            const name = (text) => '[' + theme + '] ' + text
            const each = (role) => shot.roles[role.key]

            const edgeRatio = contrastOf(shot.edgeStroke, shot.canvas)
            expect(
              edgeRatio !== null && edgeRatio >= 3,
              name('flow lines are no longer mist (≥3:1)'),
              ratioText(shot.edgeStroke, shot.canvas),
            )
            expect(
              sameColour(shot.markerFill, shot.edgeStroke),
              name('arrowheads read the same colour as their line'),
              shot.markerFill + ' vs ' + shot.edgeStroke,
            )

            const readable = ROLES.map((role) => ({
              label: role.label,
              count: each(role).count,
              ratio: contrastOf(each(role).text, each(role).fill),
            }))
            const drawn = readable.filter((entry) => entry.count > 0)
            const weak = drawn.filter((entry) => entry.ratio === null || entry.ratio < 7)
            expect(
              drawn.length === ROLES.length && weak.length === 0,
              name('labels stay readable on every role fill (≥7:1)'),
              drawn.map((entry) => entry.label + ' ' + (entry.ratio === null ? 'n/a' : entry.ratio.toFixed(1))).join(' '),
            )

            const fills = ROLES.map((role) => each(role).fill)
            const distinct = new Set(fills.map((text) => {
              const colour = cssColour(text)
              return colour ? [colour.r, colour.g, colour.b].map((part) => Math.round(part * 255)).join(',') : 'none:' + text
            }))
            expect(distinct.size === ROLES.length, name('each of the five roles gets its own fill'), distinct.size + ' colours: ' + fills.join(' '))

            const chromatic = ROLES.filter((role) => COLOURED_ROLES.indexOf(role.key) !== -1)
              .map((role) => ({ label: role.label, spread: spreadOf(each(role).fill) }))
            // The violet data fill is the quietest hue and lands at 20.0, so the
            // bar sits at 18: far above a grey (under 5) and clear of the old
            // palette (0–2), without failing on a float rounding hair.
            expect(
              chromatic.every((entry) => entry.spread !== null && entry.spread >= 18),
              name('the four coloured roles are actually coloured (channel spread ≥18)'),
              chromatic.map((entry) => entry.label + ' ' + (entry.spread === null ? 'n/a' : entry.spread.toFixed(0))).join(' '),
            )

            const hues = COLOURED_ROLES.map((key) => hueOf(shot.roles[key].fill))
            const gaps = hues.slice(1).map((hue, index) => (hue === null || hues[index] === null ? null : hueGap(hues[index], hue)))
            expect(
              gaps.length === COLOURED_ROLES.length - 1 && gaps.every((gap) => gap !== null && gap >= 20),
              name('neighbouring role hues stay apart (≥20°)'),
              gaps.map((gap) => (gap === null ? 'n/a' : gap.toFixed(0) + '°')).join(' '),
            )

            const processFill = contrastOf(each(ROLES[4]).fill, shot.canvas)
            const processStroke = contrastOf(each(ROLES[4]).stroke, shot.canvas)
            expect(
              processFill !== null && processFill > 1.05,
              name('a plain step still sits on the surface it is drawn on (>1.05)'),
              ratioText(each(ROLES[4]).fill, shot.canvas),
            )
            expect(
              processStroke !== null && processStroke >= 3,
              name('a plain step keeps a visible outline (≥3:1)'),
              ratioText(each(ROLES[4]).stroke, shot.canvas),
            )

            view.root.unmount()
            view.stage.remove()
          }

          async function authoredPass(theme) {
            const view = mount(Layer, { code: AUTHOR_CODE, streaming: false, children: hostBlock(AUTHOR_CODE) })
            await tick(180)
            const shot = measureAuthored(view.stage)
            const ink = contrastOf(shot.text, shot.fill)
            expect(
              sameColour(shot.fill, 'rgb(219, 234, 254)') && sameColour(shot.stroke, 'rgb(37, 99, 235)') && ink !== null && ink >= 7,
              '[' + theme + '] a colour the author wrote wins, and its label stays readable',
              'fill ' + shot.fill + ' stroke ' + shot.stroke + ' ink ' + ratioText(shot.text, shot.fill),
            )
            view.root.unmount()
            view.stage.remove()
          }

          async function piePass(theme) {
            const view = mount(Layer, { code: PIE_CODE, streaming: false, children: hostBlock(PIE_CODE) })
            await tick(180)
            const figure = view.stage.querySelector('.dsh-dyslexia-figure')
            const slices = figure ? Array.prototype.slice.call(figure.querySelectorAll('path')) : []
            const fills = slices.map((slice) => styleValue(slice, 'fill')).filter((text) => cssColour(text))
            const distinct = new Set(fills.map((text) => {
              const colour = cssColour(text)
              return [colour.r, colour.g, colour.b].map((part) => Math.round(part * 255)).join(',')
            }))
            // The custom property holds the recipe (`color-mix(...)`), not a
            // colour, so each one is resolved by asking the browser to paint it.
            const probe = document.createElement('span')
            probe.style.display = 'none'
            ;(figure || view.stage).appendChild(probe)
            const series = []
            for (let index = 1; index <= 8; index += 1) {
              probe.style.color = 'var(--pele-series-' + index + ')'
              const resolved = getComputedStyle(probe).color
              if (resolved) series.push(resolved)
            }
            probe.remove()
            const fromSeries = fills.filter((text) => series.some((entry) => entry !== '' && sameColour(entry, text)))
            expect(
              fills.length > 0 && distinct.size >= 3 && fromSeries.length === fills.length,
              '[' + theme + '] pie slices take the host colour series, not the engine default',
              fills.length + ' slices, ' + distinct.size + ' colours, ' + fromSeries.length + ' from the series',
            )
            view.root.unmount()
            view.stage.remove()
          }

          // One pass per diagram family: the lines have to be read against the
          // surface, and every word against the paint under it. Two ratios per
          // family, plus the chart grid — a family that drifts fails here.
          async function typesPass(theme) {
            const name = (text) => '[' + theme + '] ' + text
            for (const label of Object.keys(TYPE_CODES)) {
              const code = TYPE_CODES[label]
              const view = mount(Layer, { code: code, streaming: false, children: hostBlock(code) })
              await tick(200)
              const figure = view.stage.querySelector('.dsh-dyslexia-figure')
              const svg = figure ? figure.querySelector('svg[role="img"]') : null
              expect(!!svg, name('the engine draws a ' + label + ' diagram'), svg ? 'drawn' : 'nothing drawn')
              if (!svg) {
                view.root.unmount()
                view.stage.remove()
                continue
              }
              const canvas = surfaceAt(figure)
              const lines = []
              const shapes = svg.querySelectorAll('path, line, rect, polyline, polygon, circle, ellipse')
              for (let index = 0; index < shapes.length; index += 1) {
                const shape = shapes[index]
                const classes = shape.getAttribute('class') || ''
                // The timeline halo and the gaps between pie slices are drawn
                // in the surface colour on purpose: they separate, they do not
                // inform, so they are not lines a reader has to see.
                if (/pele-dot|pele-slice|pele-grid/.test(classes)) continue
                // A radar's web of spokes and rings is a grid, not a line that
                // carries meaning: it is measured on its own, calmly, below.
                if (label === 'radar' && (shape.tagName === 'circle' || shape.tagName === 'line')) continue
                const stroke = cssColour(styleValue(shape, 'stroke'))
                if (!stroke || stroke.a <= 0) continue
                lines.push({ ratio: ratioBetween(stroke, canvas), where: classes || shape.tagName })
              }
              const words = []
              const texts = svg.querySelectorAll('text')
              for (let index = 0; index < texts.length; index += 1) {
                const text = texts[index]
                const ink = cssColour(styleValue(text, 'fill'))
                if (!ink) continue
                let back = paintBehind(text)
                const slices = []
                if (text.closest('.pele-slice-labels')) {
                  // a slice label is read on whichever slice ends up under it
                  const painted = svg.querySelectorAll('.pele-slice')
                  for (let sliceIndex = 0; sliceIndex < painted.length; sliceIndex += 1) {
                    const colour = cssColour(styleValue(painted[sliceIndex], 'fill'))
                    if (colour) slices.push(layered(colour, canvas))
                  }
                }
                if (slices.length > 0) {
                  const worst = Math.min.apply(null, slices.map((slice) => ratioBetween(ink, slice)))
                  words.push({ ratio: worst, where: 'slice ' + (text.textContent || '').slice(0, 12) })
                  continue
                }
                // A legend entry and an axis tick sit on the canvas, not on the
                // swatch or the slot drawn beside them.
                if (text.closest('.pele-legend-item, .pele-legend, .pele-axis, .pele-axis-labels, .pele-section-labels')) back = canvas
                if (!back) back = surfaceAt(text.parentElement || text)
                words.push({ ratio: ratioBetween(ink, back), where: (text.textContent || '').slice(0, 12) })
              }
              const worstLine = lines.length > 0 ? Math.min.apply(null, lines.map((entry) => entry.ratio)) : null
              const faintest = lines.slice().sort((one, two) => one.ratio - two.ratio)[0]
              // A pie or a board has no lines to read; it must not be failed
              // for the absence of something it never drew.
              expect(
                worstLine === null || worstLine >= 3,
                name(label + ' lines read against their surface (≥3:1)'),
                worstLine === null ? 'no lines, only filled areas' : worstLine.toFixed(2) + ':1 (' + faintest.where + ')',
              )
              const worstWord = words.length > 0 ? Math.min.apply(null, words.map((entry) => entry.ratio)) : null
              const softest = words.slice().sort((one, two) => one.ratio - two.ratio)[0]
              expect(
                worstWord !== null && worstWord >= 4.5,
                name(label + ' words read on what they sit on (≥4.5:1)'),
                worstWord === null ? 'no words found' : worstWord.toFixed(2) + ':1 (' + softest.where + ')',
              )
              // A diagram is more than its lines: a state, a class, an entity and a
              // participant are what the picture is about, and a reader who gets the
              // same grey box for all of them learns nothing from the colour. One
              // node of the drawing has to carry a hue of its own.
              const nodeGroups = svg.querySelectorAll('.pele-node')
              let colourRoleNodes = 0
              for (let index = 0; index < nodeGroups.length; index += 1) {
                const classes = (nodeGroups[index].getAttribute('class') || '').split(/\s+/)
                for (let token = 0; token < classes.length; token += 1) {
                  if (classes[token].indexOf('pele-') === 0) seenNodeTokens.add(classes[token])
                }
                const role = roleOfNode(classes)
                if (role && role !== 'process') colourRoleNodes += 1
              }
              const carried = []
              const painted = svg.querySelectorAll(
                '.pele-node > :is(rect, polygon, circle, path, ellipse, polyline), .pele-task > *, .pele-slice, .pele-series > *',
              )
              for (let index = 0; index < painted.length; index += 1) {
                const value = styleValue(painted[index], 'fill')
                if (!value || value === 'none') continue
                const spread = spreadOf(value)
                if (spread !== null) carried.push(spread)
              }
              const widest = carried.length > 0 ? Math.max.apply(null, carried) : null
              // A board, a sankey or a packet frame draws no nodes: it must not
              // be failed for the absence of something it never drew.
              if (colourRoleNodes > 0 || label === 'xychart') {
                expect(
                  widest !== null && widest >= 8,
                  name(label + ' colours a node of its own (channel spread ≥8)'),
                  widest === null ? 'nothing filled' : 'widest spread ' + widest.toFixed(1),
                )
              }
              if (label === 'xychart') {
                const grid = svg.querySelector('.pele-grid')
                const ratio = grid ? ratioBetween(cssColour(styleValue(grid, 'stroke')), canvas) : null
                expect(
                  ratio !== null && ratio >= 1.4,
                  name('the chart grid is drawn at all, quiet but not absent (≥1.4:1)'),
                  ratio === null ? 'no grid' : ratio.toFixed(2) + ':1',
                )
              }
              if (label === 'radar') {
                const web = svg.querySelector('circle, line')
                const ratio = web ? ratioBetween(cssColour(styleValue(web, 'stroke')), canvas) : null
                expect(
                  ratio !== null && ratio >= 1.4,
                  name('the radar web is drawn at all, quiet but not absent (≥1.4:1)'),
                  ratio === null ? 'no web' : ratio.toFixed(2) + ':1',
                )
              }
              view.root.unmount()
              view.stage.remove()
            }
          }

          // The engine's own shape table, painted through the plugin's role
          // rules: every shape the reader can ask for is measured, so a shape
          // the plugin forgot shows up here as a grey box instead of a bug
          // report from the chat.
          async function shapesPass(theme) {
            const name = (text) => '[' + theme + '] shape ' + text
            const view = mount(Layer, { code: SHAPE_CODE, streaming: false, children: hostBlock(SHAPE_CODE) })
            await tick(240)
            const figure = view.stage.querySelector('.dsh-dyslexia-figure')
            const svg = figure ? figure.querySelector('svg[role="img"]') : null
            expect(!!svg, name('table is drawn at all'), svg ? 'drawn' : 'nothing drawn')
            if (!svg) {
              view.root.unmount()
              view.stage.remove()
              return
            }
            const canvas = surfaceAt(figure)
            const roleOf = {}
            Object.keys(SHAPE_ROLES).forEach((role) => {
              SHAPE_ROLES[role].forEach((shape) => {
                roleOf[shape] = role
              })
            })
            const grey = []
            const quiet = []
            const nodes = svg.querySelectorAll('.pele-node')
            let measured = 0
            for (let index = 0; index < nodes.length; index += 1) {
              const group = nodes[index]
              const classes = (group.getAttribute('class') || '').split(/\s+/)
              const shapeClass = classes.filter((one) => one.indexOf('pele-shape-') === 0)[0]
              if (!shapeClass) continue
              const shape = shapeClass.slice('pele-shape-'.length)
              const role = roleOf[shape]
              if (!role) continue
              const painted = group.querySelector('rect, polygon, circle, path, ellipse, polyline')
              if (!painted) continue
              measured += 1
              const fill = cssColour(styleValue(painted, 'fill'))
              const stroke = cssColour(styleValue(painted, 'stroke'))
              if (role === 'process') {
                const plain = fill ? ratioBetween(fill, canvas) : null
                const edge = stroke ? ratioBetween(stroke, canvas) : null
                if (plain === null || plain < 1.05 || edge === null || edge < 3) {
                  quiet.push(shape + ' (' + (plain === null ? 'none' : plain.toFixed(2)) + '/' + (edge === null ? 'none' : edge.toFixed(2)) + ')')
                }
                continue
              }
              const spread = spreadOf(styleValue(painted, 'fill'))
              if (spread === null || spread < 8) grey.push(shape + ' (' + (spread === null ? 'none' : spread.toFixed(1)) + ')')
            }
            expect(
              measured === SHAPES.length,
              name('every shape in the engine table is drawn once'),
              measured + ' of ' + SHAPES.length,
            )
            expect(
              grey.length === 0,
              name('every shape in a coloured role carries its hue'),
              grey.length === 0 ? 'all ' + measured + ' measured' : grey.join(', '),
            )
            expect(
              quiet.length === 0,
              name('the plain shapes stay plain yet visible'),
              quiet.length === 0 ? 'all quiet as intended' : quiet.join(', '),
            )
            view.root.unmount()
            view.stage.remove()
          }

          // FR-007: if the host never hands over its tokens, every `color-mix()`
          // collapses and the picture must fall back to the engine's own theme
          // instead of vanishing. The fixture strips the tokens on one stage.
          const HOST_TOKEN_NAMES = [
            '--dsw-alias-bg-base',
            '--dsw-alias-bg-layer-1',
            '--dsw-alias-label-primary',
            '--dsw-alias-label-secondary',
            '--dsw-alias-label-tertiary',
            '--dsw-alias-link',
            '--dsw-alias-chart-messages',
            '--dsw-alias-state-error-primary',
            '--dsw-static-green-500',
            '--dsw-static-amber-500',
            '--dsw-static-violet-400',
            '--dsw-static-blue-400',
            '--dsw-static-deepseek-400',
            '--dsw-static-red-500',
            '--dsw-static-neutral-bluish-400',
            '--dsw-static-neutral-bluish-1000',
            '--dsw-static-neutral-bluish-50',
          ]

          async function defaultsPass() {
            const view = mount(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) })
            HOST_TOKEN_NAMES.forEach((name) => view.stage.style.setProperty(name, 'initial'))
            await tick(200)
            const figure = view.stage.querySelector('.dsh-dyslexia-figure')
            const svg = figure ? figure.querySelector('svg[role="img"]') : null
            const canvas = surfaceAt(view.stage)
            const edge = svg ? svg.querySelector('g.pele-edges') : null
            const lineRatio = edge ? ratioBetween(cssColour(styleValue(edge, 'stroke')), canvas) : null
            const text = svg ? svg.querySelector('text') : null
            const inkRatio = text ? ratioBetween(cssColour(styleValue(text, 'fill')), paintBehind(text) || canvas) : null
            expect(
              !!svg && lineRatio !== null && lineRatio >= 3 && inkRatio !== null && inkRatio >= 4.5,
              'without host tokens the engine theme still draws a readable picture',
              'lines ' + (lineRatio === null ? 'none' : lineRatio.toFixed(2) + ':1') + ', words ' + (inkRatio === null ? 'none' : inkRatio.toFixed(2) + ':1'),
            )
            view.root.unmount()
            view.stage.remove()
          }

          for (const theme of ['light', 'dark']) {
            if (theme === 'dark') document.body.setAttribute('data-ds-dark-theme', '')
            await tick(80)
            await palettePass(theme)
            await authoredPass(theme)
            await piePass(theme)
            await typesPass(theme)
            await shapesPass(theme)
            if (theme === 'dark') document.body.removeAttribute('data-ds-dark-theme')
          }
          await tick(60)
          await defaultsPass()

          // Every kind of node the engine painted above has to have a rule of
          // its own. A new kind of node in a future engine fails this check,
          // which is the whole point: the gap is found here, not in the chat.
          {
            const sheets = []
            for (let index = 0; index < document.styleSheets.length; index += 1) {
              const sheet = document.styleSheets[index]
              let rules = []
              try {
                rules = Array.prototype.slice.call(sheet.cssRules)
              } catch (error) {
                rules = []
              }
              for (let rule = 0; rule < rules.length; rule += 1) {
                sheets.push(rules[rule].cssText || '')
              }
            }
            const css = sheets.join('\n')
            const unruled = Array.prototype.slice.call(seenNodeTokens).filter((token) => {
              if (UNCOLOURED_NODE_TOKENS.indexOf(token) >= 0) return false
              if (/%/.test(token)) return false
              return css.indexOf('.' + token) < 0
            })
            expect(
              unruled.length === 0,
              'every kind of node the engine paints has a rule of its own',
              unruled.length === 0 ? seenNodeTokens.size + ' kinds, all ruled' : 'no rule for ' + unruled.join(', '),
            )
          }

          // The negative check: put the old line colour back on one picture and
          // demand that the line check above would fail. An assertion nobody has
          // seen fail is a wish; this one prints a number instead.
          {
            const teeth = mount(Layer, { code: PALETTE_CODE, streaming: false, children: hostBlock(PALETTE_CODE) })
            await tick(160)
            const figure = teeth.stage.querySelector('.dsh-dyslexia-figure')
            if (figure) figure.style.setProperty('--pele-line', 'var(--dsw-alias-border-l2)')
            await tick(80)
            const shot = measurePalette(teeth.stage)
            const ratio = contrastOf(shot.edgeStroke, shot.canvas)
            expect(
              ratio !== null && ratio < 3,
              'assertion has teeth: the old border colour reads below 3:1',
              ratioText(shot.edgeStroke, shot.canvas),
            )
            teeth.root.unmount()
            teeth.stage.remove()
          }

          /* ---------------------------------------------- host that says no */
          const retry = makeContext({ rejectLocale: true })
          let retryThrew = null
          try {
            window.__module.apply(retry.ctx)
          } catch (error) {
            retryThrew = error
          }
          expect(!retryThrew, 'a host that rejects the locale option does not break apply')
          expect(retry.defs.length === 1, 'the layer is registered once after the retry', String(retry.defs.length))
          expect(!!retry.defs[0] && retry.defs[0].def.locale === undefined, 'the retried registration drops the locale option', JSON.stringify(retry.defs[0] && retry.defs[0].def))

          for (const hostile of [undefined, null, {}, { slots: null }, { slots: {} }, { slots: { inject() {}, register() {} } }, { slots: { inject() { throw new Error('inject refused') }, register() {} } }]) {
            let hostileThrew = null
            try {
              window.__module.apply(hostile)
            } catch (error) {
              hostileThrew = error
            }
            expect(!hostileThrew, 'apply stays silent on a changed host', String(hostileThrew && hostileThrew.message))
          }

          /* ------------------- stop the fiber: what is left behind */
          const life = makeContext()
          window.__module.apply(life.ctx)
          expect(!!document.getElementById('dsh-dyslexia-figure-style'), 'styles arrive with apply', String(!!document.getElementById('dsh-dyslexia-figure-style')))
          expect(life.defs.length === 1, 'one fence layer while installed', String(life.defs.length))
          expect(life.calls.effects >= 2, 'styles and strings are claimed as effects', String(life.calls.effects))
          const lifeStage = document.createElement('div')
          lifeStage.className = 'stage'
          document.getElementById('mount').appendChild(lifeStage)
          const lifeRoot = ReactDOM.createRoot(lifeStage)
          lifeRoot.render(React.createElement(life.defs[0].component, { code: CODE, streaming: false, children: hostBlock(CODE) }))
          await tick(120)
          expect(!!lifeStage.querySelector('.dsh-dyslexia-figure'), 'the layer draws while the fiber lives', String(!!lifeStage.querySelector('.dsh-dyslexia-figure')))
          lifeRoot.unmount()
          life.dispose()
          await tick(60)
          expect(document.getElementById('dsh-dyslexia-figure-style') === null, 'disabling the plugin takes its stylesheet away', String(!!document.getElementById('dsh-dyslexia-figure-style')))
          expect(life.calls.stringsDropped === 1, 'the locale registration is dropped', String(life.calls.stringsDropped))
          expect(life.defs.length === 0, 'the fence layer is gone once the host disposes', String(life.defs.length))
          lifeStage.remove()

          // A host that offers no `ctx.effect` cannot promise us a teardown. The
          // stylesheet is still added (the picture needs it), but a second apply
          // must reclaim the first one instead of stacking a new copy.
          const noEffect = makeContext()
          delete noEffect.ctx.effect
          window.__module.apply(noEffect.ctx)
          window.__module.apply(noEffect.ctx)
          expect(noEffect.defs.length === 1, 'a second apply does not add a second fence layer', String(noEffect.defs.length))
          const strayStyles = document.querySelectorAll('style[id="dsh-dyslexia-figure-style"]')
          expect(
            strayStyles.length === 1,
            'a host without effects keeps one stylesheet, not one per apply',
            String(strayStyles.length),
          )
          Array.prototype.slice.call(strayStyles).forEach((node) => node.remove())
          /* ---------------------------------- no internal key is ever shown */
          const keys = ['copyFailed', 'copySource', 'engineUnavailable', 'figureLabel', 'renderFailed', 'syntaxError']
          const keyEcho = mount(Layer, { code: BAD, streaming: false, children: hostBlock(BAD), t: (key) => key })
          await tick(90)
          const keyEchoText = keyEcho.stage.textContent + ' ' + Array.from(keyEcho.stage.querySelectorAll('[aria-label]')).map((node) => node.getAttribute('aria-label')).join(' ')
          const leaked = keys.filter((key) => keyEchoText.indexOf(key) !== -1)
          expect(leaked.length === 0, 'no internal key reaches the eye', 'leaked: ' + leaked.join(', '))
          keyEcho.root.unmount()
          keyEcho.stage.remove()

          /* ------------------------- each size limit on its own, so neither hides the other */
          // Over the character limit (24 KiB) and nowhere near the edge limit (400):
          // strip `limit` from figure.js and this one starts drawing.
          const longSource = 'flowchart LR\n' + Array.from({ length: 40 }, (_, index) => `  N${index}[${'x'.repeat(760)}] --> N${index + 1}[node]`).join('\n')
          const longView = mount(Layer, { code: longSource, streaming: false, children: hostBlock('long') })
          await tick(200)
          expect(!!longView.stage.querySelector('.dsh-dyslexia-note'), 'a source over the size limit says why', longView.stage.textContent.slice(0, 40))
          expect(longView.stage.textContent.indexOf('long') !== -1, 'a source over the size limit keeps the host block')
          expect(!longView.stage.querySelector('[role="img"]'), 'a source over the size limit is not drawn')
          longView.root.unmount()
          longView.stage.remove()

          // Over the edge limit (400) and far under the character limit: strip
          // `maxEdges` from figure.js and this one starts drawing instead.
          const manyEdges = 'flowchart LR\n' + Array.from({ length: 420 }, (_, index) => `  A${index} --> A${index + 1}`).join('\n')
          const edgeView = mount(Layer, { code: manyEdges, streaming: false, children: hostBlock('many edges') })
          await tick(200)
          expect(!!edgeView.stage.querySelector('.dsh-dyslexia-note'), 'a picture with too many edges says why', edgeView.stage.textContent.slice(0, 40))
          expect(edgeView.stage.textContent.indexOf('many edges') !== -1, 'a picture with too many edges keeps the host block')
          expect(!edgeView.stage.querySelector('[role="img"]'), 'a picture with too many edges is not drawn')
          edgeView.root.unmount()
          edgeView.stage.remove()

          /* ----------------------------------- streaming turns into a picture */
          const turnStage = document.createElement('div')
          turnStage.className = 'stage'
          document.getElementById('mount').appendChild(turnStage)
          const turnRoot = ReactDOM.createRoot(turnStage)
          turnRoot.render(React.createElement(Layer, { code: CODE, streaming: true, children: hostBlock(CODE) }))
          await tick(60)
          const duringStream = !turnStage.querySelector('[role="img"]')
          turnRoot.render(React.createElement(Layer, { code: CODE, streaming: false, children: hostBlock(CODE) }))
          await tick(120)
          expect(duringStream && !!turnStage.querySelector('[role="img"]'), 'the picture appears when the stream ends')
          turnRoot.unmount()
          turnStage.remove()

          /* ------------------------------- a host that hands over empty children */
          const emptyChildren = mount(Layer, { code: BAD, streaming: false, children: false })
          await tick(90)
          expect(emptyChildren.stage.textContent.indexOf(BAD) !== -1, 'a falsy children is not mistaken for content', emptyChildren.stage.textContent.slice(0, 40))
          emptyChildren.root.unmount()
          emptyChildren.stage.remove()

          /* ------------------- a host that hands over something React refuses */
          // A plain object, a function, or an array holding one: React throws
          // #31 while rendering, and if that happened inside this layer's own
          // boundary the boundary could not catch it — the message would vanish.
          const refused = [
            { label: 'object', value: { nope: true }, code: CODE, streaming: true },
            { label: 'function', value: () => null, code: CODE, streaming: true },
            { label: 'object in a failed picture', value: { nope: true }, code: BAD, streaming: false },
            { label: 'array with an object', value: [hostBlock(BAD), { nope: true }], code: BAD, streaming: false },
          ]
          for (const scenario of refused) {
            const stage = document.createElement('div')
            stage.className = 'stage'
            document.getElementById('mount').appendChild(stage)
            const root = ReactDOM.createRoot(stage)
            let threw = null
            const consoleErrors = []
            const originalError = console.error
            console.error = (...args) => {
              consoleErrors.push(String(args[0]))
            }
            try {
              root.render(
                React.createElement(Layer, {
                  code: scenario.code,
                  streaming: scenario.streaming,
                  children: scenario.value,
                }),
              )
              await tick(120)
            } catch (error) {
              threw = error
            } finally {
              console.error = originalError
            }
            const text = stage.textContent.trim()
            expect(
              !threw && stage.childNodes.length > 0 && text.length > 0,
              `a refused children cannot empty the message — ${scenario.label}`,
              threw ? String(threw).slice(0, 60) : `children=${stage.childNodes.length} text=${text.slice(0, 20)}`,
            )
            expect(
              stage.textContent.indexOf(scenario.code) !== -1,
              `a refused children falls back to the source — ${scenario.label}`,
              JSON.stringify(stage.textContent.slice(0, 40)),
            )
            expect(
              consoleErrors.every((line) => line.indexOf('#31') === -1),
              `no React error 31 escapes — ${scenario.label}`,
