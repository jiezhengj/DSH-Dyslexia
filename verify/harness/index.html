          const tabbable = reachable.filter((node) => node.getAttribute('tabindex') !== '-1')
          expect(
            reachable.length > 0 && tabbable.length === reachable.length,
            'every zoom button in reach can take the keyboard',
            `${tabbable.length}/${reachable.length} reachable of ${zoomButtons.length}`,
          )
          // At first only zoom-in is enabled: the other two appear once the
          // picture is scaled, and they have to be just as reachable then.
          if (reachable.length > 0) {
            reachable[0].click()
            await tick(150)
            const zoomed = Array.prototype.slice
              .call(wideStage.querySelectorAll('button'))
              .filter((node) => !node.closest('.dsh-dyslexia-bar'))
            const zoomedReachable = zoomed.filter(
              (node) => node.disabled !== true && node.offsetParent !== null && node.getClientRects().length > 0,
            )
            const zoomedTabbable = zoomedReachable.filter((node) => node.getAttribute('tabindex') !== '-1')
            expect(
              zoomed.length > 1 && zoomedReachable.length === zoomed.length && zoomedTabbable.length === zoomed.length,
              'every zoom button is reachable once the picture is zoomed',
              `${zoomedTabbable.length}/${zoomed.length} after zoom`,
            )
          }
          wideRoot.unmount()
          wideStage.remove()

          /* ------------------------------------------------ settings row */
          // A host that offers `configForms` gets one row on the general
          // settings slot. The fake face can read, write, reject a write and
          // change from the outside, so what the row shows can be checked
          // against state this fixture controls.
          document.documentElement.lang = 'zh'
          const SETTINGS_LABEL = '优先用图，而不是成段文字'
          const SETTINGS_HINT = '当一张图比一段话更好懂时，模型会画图，文字只留图讲不清的部分。'
          const SETTINGS_SAVED = '已保存'
          const SETTINGS_FAILED = '保存失败，开关保持原来的状态。'
          const settingsState = { value: { visualFirst: true } }
          const settingsSets = []
          const settingsListeners = new Set()
          let settingsFailNext = false
          let settingsRefuseNext = false
          const settingsFace = {
            getSnapshot() {
              return { value: { visualFirst: settingsState.value.visualFirst } }
            },
            subscribe(listener) {
              settingsListeners.add(listener)
              return () => settingsListeners.delete(listener)
            },
            set(field, value) {
              settingsSets.push([field, value])
              if (settingsFailNext) {
                settingsFailNext = false
                return Promise.reject(new Error('write rejected'))
              }
              if (settingsRefuseNext) {
                settingsRefuseNext = false
                // The real host reloads its mirror and tells subscribers the
                // value it kept *before* the refused write returns; the row must
                // follow that value, not the one it captured before the click.
                settingsListeners.forEach((listener) => listener())
                return Promise.resolve(false)
              }
              settingsState.value[field] = value
              settingsListeners.forEach((listener) => listener())
              return Promise.resolve()
            },
          }
          const settingsHost = makeContext({})
          settingsHost.ctx.configForms = {
            get(namespace) {
              return namespace === 'dsh-dyslexia' ? settingsFace : null
            },
          }
          let settingsThrew = null
          try {
            module.apply(settingsHost.ctx)
          } catch (error) {
            settingsThrew = error
          }
          expect(
            settingsThrew === null,
            'a host with configForms takes the row without throwing',
            settingsThrew ? String(settingsThrew.message) : 'quiet',
          )
          expect(
            settingsHost.injectedSlots.indexOf('settings.general.item') !== -1,
            'the row is claimed through the slot the host names',
            settingsHost.injectedSlots.join(','),
          )
          const settingsDefs = settingsHost.defs.filter(
            (entry) => entry.def && entry.def.name === 'settings.general.item',
          )
          expect(
            settingsHost.defs.length === 2 && settingsDefs.length === 1,
            'the row registers on the general settings slot and nowhere else',
            `${settingsHost.defs.length} defs, ${settingsDefs.length} on the slot`,
          )
          const settingsDef = (settingsDefs[0] && settingsDefs[0].def) || {}
          expect(
            settingsDef.id === '@jiezhengj/dsh-dyslexia/visual-first' &&
              settingsDef.order === 62 &&
              settingsDef.locale === 'dyslexia',
            'the row carries its id, order and locale',
            `${settingsDef.id} ${settingsDef.order} ${settingsDef.locale}`,
          )
          // A host with no `slots` cannot draw a fence at all, so that one says
          // so out loud; the two lean shapes that still leave the picture
          // working lose only the switch and must stay silent. A guard that
          // disappears from `wireSettingsRow` turns the drop into a throw and the
          // throw into a second warning, which both of these catch.
          const noSlotsHost = makeContext({})
          delete noSlotsHost.ctx.slots
          const noSlotsWarnings = captureWarnings(() => module.apply(noSlotsHost.ctx))
          expect(
            noSlotsWarnings.length === 1 && /slots service unavailable/.test(noSlotsWarnings[0]),
            'a host with no slots service is told once that nothing can be drawn',
            noSlotsWarnings.join(' | ') || 'silent',
          )
          // `slots` that can inject but cannot register, with a face that reads:
          // the fence layer fails on its own, and the row must not add a second
          // failure of its own. The guards inside `wireSettingsRow` are what keep
          // this to one warning.
          const oldSlotsHost = makeContext({})
          const partialSlots = { inject: (name, run) => run() }
          oldSlotsHost.ctx.slots = partialSlots
          oldSlotsHost.ctx.get = (name) => (name === 'slots' ? partialSlots : undefined)
          oldSlotsHost.ctx.configForms = {
            get: (namespace) => (namespace === 'dsh-dyslexia' ? settingsFace : null),
          }
          const oldSlotsWarnings = captureWarnings(() => module.apply(oldSlotsHost.ctx))
          expect(
            oldSlotsWarnings.length === 1 && /^dsh-dyslexia: slots/.test(oldSlotsWarnings[0]),
            'an older slots service that cannot register is reported once',
            oldSlotsWarnings.join(' | ') || 'silent',
          )
          const leanHosts = [
            ['a host with no configForms', () => makeContext({})],
            ['a host whose face lookup finds nothing', () => {
              const host = makeContext({})
              host.ctx.configForms = { get: () => null }
              return host
            }],
          ]
          for (const [label, build] of leanHosts) {
            const host = build()
            const warnings = captureWarnings(() => module.apply(host.ctx))
            expect(
              warnings.length === 0,
              label + ' stays quiet',
              warnings.length === 0 ? 'no warning' : warnings.join(' | '),
            )
          }

          const Row = settingsDefs[0] && settingsDefs[0].component
          const rowInject = typeof settingsDef.inject === 'function' ? settingsDef.inject() : {}

          // The host does not read `hooks.visualFirst` itself: it turns the
          // store into a hook prop through `useSyncExternalStore(store.subscribe,
          // store.getSnapshot)`. A store without `getSnapshot` throws there and
          // the settings page loses the row even though it registered — that is
          // the 0.2.5 defect, so the store this module hands over is read the
          // same way here instead of being trusted as an object.
          const ownStore = rowInject.hooks && rowInject.hooks.visualFirst
          expect(
            !!ownStore &&
              typeof ownStore.subscribe === 'function' &&
              typeof ownStore.getSnapshot === 'function' &&
              ownStore.getSnapshot() === true,
            'the store this module hands the host can be read the way the host reads it',
            ownStore
              ? `get=${typeof ownStore.get} getSnapshot=${typeof ownStore.getSnapshot} subscribe=${typeof ownStore.subscribe}`
              : 'no store',
          )
          function useVisualFirstFromOwnStore(selector) {
            const current = React.useSyncExternalStore(
              (listener) => ownStore.subscribe(listener),
              () => ownStore.getSnapshot(),
            )
            return typeof selector === 'function' ? selector(current === undefined ? true : current !== false) : current
          }
          const ownStoreView = mount(Row, { ...rowInject, useVisualFirst: useVisualFirstFromOwnStore })
          await tick(40)
          const ownStoreToggle = ownStoreView.stage.querySelector('button[role="switch"]')
          expect(
            !!ownStoreToggle && ownStoreToggle.getAttribute('aria-checked') === 'true',
            'a hook built from that store draws the switch',
            ownStoreToggle ? `aria-checked=${ownStoreToggle.getAttribute('aria-checked')}` : 'no switch',
          )
          ownStoreView.root.unmount()
          ownStoreView.stage.remove()
          const rowView = mount(Row, rowInject)
          await tick(40)
          const row = rowView.stage.querySelector('.dsh-dyslexia-row')
          const toggle = rowView.stage.querySelector('button[role="switch"]')
          expect(!!row, 'the settings row renders inside its slot component')
          const rowLabel = rowView.stage.querySelector('.dsh-dyslexia-row-label')
          const rowHint = rowView.stage.querySelector('.dsh-dyslexia-row-hint')
          expect(
            !!rowLabel && rowLabel.textContent === SETTINGS_LABEL,
            'the row label is our own sentence, not a host key',
            rowLabel ? rowLabel.textContent : 'no label',
          )
          expect(
            !!rowHint && rowHint.textContent === SETTINGS_HINT,
            'the row hint is our own sentence, not a host key',
            rowHint ? rowHint.textContent : 'no hint',
          )
          expect(
            !!toggle && toggle.getAttribute('aria-checked') === 'true',
            'the switch shows the value the host reports',
            toggle ? String(toggle.getAttribute('aria-checked')) : 'no switch',
          )
          const labelledBy = toggle ? toggle.getAttribute('aria-labelledby') : null
          const describedBy = toggle ? toggle.getAttribute('aria-describedby') : null
          const namedBy = labelledBy ? document.getElementById(labelledBy) : null
          const describedByNode = describedBy ? document.getElementById(describedBy) : null
          expect(
            !!namedBy &&
              namedBy.textContent === SETTINGS_LABEL &&
              !!describedByNode &&
              describedByNode.textContent === SETTINGS_HINT,
            'the switch is named and described by the visible sentences',
            `${labelledBy} -> ${namedBy ? namedBy.textContent : 'missing'} | ${describedBy} -> ${
              describedByNode ? describedByNode.textContent : 'missing'
            }`,
          )
          expect(
            !!toggle && toggle.disabled !== true && toggle.getAttribute('tabindex') !== '-1',
            'the switch keeps the keyboard',
            toggle ? `disabled=${toggle.disabled} tabindex=${toggle.getAttribute('tabindex')}` : 'no switch',
          )
          expect(
            rowView.stage.querySelector('[role="status"]') === null,
            'no status sentence before the reader touches the switch',
          )
          toggle.click()
          await tick(60)
          expect(
            settingsSets.length === 1 && settingsSets[0][0] === 'visualFirst' && settingsSets[0][1] === false,
            'one click asks the host for the opposite value once',
            JSON.stringify(settingsSets),
          )
          expect(
            toggle.getAttribute('aria-checked') === 'false',
            'the switch turns off after the write',
            String(toggle.getAttribute('aria-checked')),
          )
          const savedStatus = rowView.stage.querySelector('[role="status"]')
          expect(
            !!savedStatus && savedStatus.textContent === SETTINGS_SAVED,
            'a saved write says so in the status sentence',
            savedStatus ? savedStatus.textContent : 'no status',
          )
          // A rejected write must put the switch back and say the value did
          // not change; showing the intended value would be a lie.
          settingsFailNext = true
          toggle.click()
          await tick(60)
          expect(
            settingsSets.length === 2 && settingsSets[1][0] === 'visualFirst' && settingsSets[1][1] === true,
            'the second click tries the other value once',
            JSON.stringify(settingsSets),
          )
          expect(
            toggle.getAttribute('aria-checked') === String(settingsState.value.visualFirst),
            'a rejected write leaves the switch where the host put it',
            `aria-checked=${toggle.getAttribute('aria-checked')} host=${settingsState.value.visualFirst}`,
          )
          const failedStatus = rowView.stage.querySelector('[role="status"]')
          expect(
            !!failedStatus && failedStatus.textContent === SETTINGS_FAILED,
            'a rejected write explains itself in the status sentence',
            failedStatus ? failedStatus.textContent : 'no status',
          )
          // A refusal is a fulfilled `false`, not a rejection: the host answered
          // and said no. The switch must go back to the value in effect and the
          // row must say the change was not saved.
          settingsState.value.visualFirst = true
          settingsListeners.forEach((listener) => listener())
          await tick(40)
          const refusedToggle = rowView.stage.querySelector('button[role="switch"]')
          settingsRefuseNext = true
          refusedToggle.click()
          await tick(60)
          const refusedStatus = rowView.stage.querySelector('[role="status"]')
          expect(
            settingsSets.length === 3 &&
              settingsSets[2][0] === 'visualFirst' &&
              settingsSets[2][1] === false &&
              refusedToggle.getAttribute('aria-checked') === String(settingsState.value.visualFirst) &&
              !!refusedStatus &&
              refusedStatus.textContent === SETTINGS_FAILED,
            'a refused write that resolves false puts the switch back and says so',
            `sets=${JSON.stringify(settingsSets)} aria-checked=${refusedToggle.getAttribute(
              'aria-checked',
            )} host=${settingsState.value.visualFirst} status=${refusedStatus ? refusedStatus.textContent : 'none'}`,
          )
          rowView.root.unmount()
          rowView.stage.remove()
          settingsHost.dispose()

          // Two windows on one host: the other window changes the value while
          // this row's write is still pending, the host announces it, and only
          // then does the write come back refused. The switch must show what the
          // host holds now, not the value it captured before the click.
          const pendingState = { value: { visualFirst: false } }
          const pendingListeners = new Set()
          const pendingAnswers = []
          const pendingFace = {
            getSnapshot() {
              return { value: { visualFirst: pendingState.value.visualFirst } }
            },
            subscribe(listener) {
              pendingListeners.add(listener)
              return () => pendingListeners.delete(listener)
            },
            set(field, value) {
              // The write stays pending until the fixture answers it, so the
              // external value can arrive first, as it does in the real host.
              return new Promise((resolve) => {
                pendingAnswers.push({ field, value, resolve })
              })
            },
          }
          const pendingHost = makeContext({})
          pendingHost.ctx.configForms = {
            get(namespace) {
              return namespace === 'dsh-dyslexia' ? pendingFace : null
            },
          }
          module.apply(pendingHost.ctx)
          const pendingDef = pendingHost.defs.find(
            (entry) => entry.def && entry.def.name === 'settings.general.item',
          )
          const pendingView = pendingDef ? mount(pendingDef.component, pendingDef.def.inject()) : null
          if (pendingView) await tick(40)
          const pendingToggle = pendingView ? pendingView.stage.querySelector('button[role="switch"]') : null
          if (pendingToggle) pendingToggle.click()
          await tick(20)
          // The other window switches it on and the host tells this row.
          pendingState.value.visualFirst = true
          pendingListeners.forEach((listener) => listener())
          await tick(20)
          // Only now does this row's write answer "refused".
          pendingAnswers.forEach((answer) => answer.resolve(false))
          await tick(80)
          const pendingStatus = pendingView ? pendingView.stage.querySelector('[role="status"]') : null
          expect(
            !!pendingToggle &&
              pendingState.value.visualFirst === true &&
              pendingToggle.getAttribute('aria-checked') === String(pendingState.value.visualFirst) &&
              !!pendingStatus &&
              pendingStatus.textContent === SETTINGS_FAILED,
            'a refused write keeps the value the host took while it was pending',
            pendingToggle
              ? `aria-checked=${pendingToggle.getAttribute('aria-checked')} host=${
                  pendingState.value.visualFirst
                } status=${pendingStatus ? pendingStatus.textContent : 'none'}`
              : 'no switch',
          )
          if (pendingView) {
            pendingView.root.unmount()
            pendingView.stage.remove()
          }
          pendingHost.dispose()

          // No click at all: the host announces a new value after mount, as a
          // second window or the host's own recovery does. Both the accessible
          // state and the paint have to follow it.
          const externalState = { value: { visualFirst: true } }
          const externalListeners = new Set()
          const externalFace = {
            getSnapshot() {
              return { value: { visualFirst: externalState.value.visualFirst } }
            },
            subscribe(listener) {
              externalListeners.add(listener)
              return () => externalListeners.delete(listener)
            },
            set(field, value) {
              externalState.value[field] = value
              externalListeners.forEach((listener) => listener())
              return Promise.resolve()
            },
          }
          const externalHost = makeContext({})
          externalHost.ctx.configForms = {
            get(namespace) {
              return namespace === 'dsh-dyslexia' ? externalFace : null
            },
          }
          module.apply(externalHost.ctx)
          const externalDef = externalHost.defs.find(
            (entry) => entry.def && entry.def.name === 'settings.general.item',
          )
          const externalView = externalDef ? mount(externalDef.component, externalDef.def.inject()) : null
          if (externalView) await tick(250)
          const externalToggle = externalView
            ? externalView.stage.querySelector('button[role="switch"]')
            : null
          // The paint has to be readable at once: a 120ms transition would still
          // be on its way when a headless run reads the style, so it is switched
          // off for this one node and the colour is the state itself.
          if (externalToggle) externalToggle.style.transition = 'none'
          const paintOf = (node) =>
            node && typeof getComputedStyle === 'function' ? getComputedStyle(node).backgroundColor : ''
          const onPaint = paintOf(externalToggle)
          externalState.value.visualFirst = false
          externalListeners.forEach((listener) => listener())
          await tick(250)
          const offPaint = paintOf(externalToggle)
          expect(
            !!externalToggle &&
              externalToggle.getAttribute('aria-checked') === 'false' &&
              onPaint.includes('74, 108, 247') &&
              offPaint.includes('120, 130, 150'),
            'a value the host pushes reaches the switch without a write',
            `aria-checked=${
              externalToggle ? externalToggle.getAttribute('aria-checked') : 'no switch'
            } paint ${onPaint} -> ${offPaint}`,
          )
          if (externalView) {
            externalView.root.unmount()
            externalView.stage.remove()
          }
          externalHost.dispose()

          // A host that hands back a thenable whose `then` throws has refused the
          // write, but the throw must not escape the click handler and the row
          // must still say the value did not change.
          const thenState = { value: { visualFirst: true } }
          const thenFace = {
            getSnapshot() {
              return { value: { visualFirst: thenState.value.visualFirst } }
            },
            subscribe() {
              return () => {}
            },
            set() {
              return {
                then() {
                  throw new Error('the host refused while its answer was being watched')
                },
              }
            },
          }
          const thenHost = makeContext({})
          thenHost.ctx.configForms = {
            get(namespace) {
              return namespace === 'dsh-dyslexia' ? thenFace : null
            },
          }
          module.apply(thenHost.ctx)
          const thenDef = thenHost.defs.find((entry) => entry.def && entry.def.name === 'settings.general.item')
          const thenView = thenDef ? mount(thenDef.component, thenDef.def.inject()) : null
          if (thenView) await tick(40)
          const thenToggle = thenView ? thenView.stage.querySelector('button[role="switch"]') : null
          let thenThrew = null
          let thenUncaught = null
          const catchThenUncaught = (event) => {
            thenUncaught = event.error || event.message
          }
          window.addEventListener('error', catchThenUncaught)
          if (thenToggle) {
            try {
              thenToggle.click()
            } catch (error) {
              thenThrew = error
            }
            await tick(80)
          }
          window.removeEventListener('error', catchThenUncaught)
          const thenStatus = thenView ? thenView.stage.querySelector('[role="status"]') : null
          expect(
            !!thenToggle &&
              thenThrew === null &&
              thenUncaught === null &&
              thenToggle.getAttribute('aria-checked') === String(thenState.value.visualFirst) &&
              !!thenStatus &&
              thenStatus.textContent === SETTINGS_FAILED,
            'a thenable that throws out of then cannot break the click',
            thenToggle
              ? `threw=${thenThrew ? String(thenThrew.message) : 'no'} uncaught=${
                  thenUncaught ? String(thenUncaught.message || thenUncaught) : 'no'
                } aria-checked=${thenToggle.getAttribute(
                  'aria-checked',
                )} host=${thenState.value.visualFirst} status=${thenStatus ? thenStatus.textContent : 'none'}`
              : 'no switch',
          )
          if (thenView) {
            thenView.root.unmount()
            thenView.stage.remove()
          }
          thenHost.dispose()

          // The label and the hint are bundled sentences chosen by the interface
          // language, not host keys. English would satisfy every language, so each
          // one is compared with its own string from src/client/i18n.js.
          const SETTING_LABELS = {
            zh: '优先用图，而不是成段文字',
            en: 'Prefer pictures to prose',
            ja: '文章より図を優先',
            es: 'Prefiere las imágenes al texto',
            fr: 'Préférer les schémas au texte',
            de: 'Bilder statt Textabsätze',
            ru: 'Картинки вместо абзацев',
            pt: 'Preferir imagens ao texto',
          }
          const SETTING_HINTS = {
            zh: '当一张图比一段话更好懂时，模型会画图，文字只留图讲不清的部分。',
            en: 'When a picture carries the answer better than a paragraph, the model draws one and keeps the text to what the picture cannot show.',
            ja: '図のほうが伝わりやすいときは図を描き、文章は図で表せない部分だけにします。',
            es: 'Cuando una imagen explica mejor que un párrafo, el modelo dibuja y deja en texto solo lo que la imagen no puede mostrar.',
            fr: 'Quand un schéma explique mieux qu\'un paragraphe, le modèle en dessine un et ne garde en texte que ce que le schéma ne peut pas montrer.',
            de: 'Wenn ein Bild mehr erklärt als ein Absatz, zeichnet das Modell eines und lässt im Text nur, was das Bild nicht zeigen kann.',
            ru: 'Когда рисунок объясняет лучше абзаца, модель рисует его, а в тексте оставляет только то, чего на рисунке не видно.',
            pt: 'Quando uma imagem explica melhor que um parágrafo, o modelo desenha e deixa no texto só o que a imagem não mostra.',
          }
          for (const lang of LANGS) {
            document.documentElement.lang = lang
            const langHost = makeContext({})
            langHost.ctx.configForms = {
              get(namespace) {
                return namespace === 'dsh-dyslexia' ? settingsFace : null
              },
            }
            module.apply(langHost.ctx)
            const langDef = langHost.defs.find((entry) => entry.def && entry.def.name === 'settings.general.item')
            const langView = langDef ? mount(langDef.component, langDef.def.inject()) : null
            if (langView) await tick(40)
            const langLabel = langView ? langView.stage.querySelector('.dsh-dyslexia-row-label') : null
            const langHint = langView ? langView.stage.querySelector('.dsh-dyslexia-row-hint') : null
            expect(
              !!langLabel && langLabel.textContent === SETTING_LABELS[lang],
              `[${lang}] the settings row label is that language's own sentence`,
              langLabel ? langLabel.textContent : 'no label',
            )
            expect(
              !!langHint && langHint.textContent === SETTING_HINTS[lang],
              `[${lang}] the settings row hint is that language's own sentence`,
              langHint ? langHint.textContent : 'no hint',
            )
            if (langView) {
              langView.root.unmount()
              langView.stage.remove()
            }
            langHost.dispose()
          }
          document.documentElement.lang = 'zh'

          // A host that already says "off" must show "off" on first paint.
          const offState = { value: { visualFirst: false } }
          const offFace = {
            getSnapshot() {
              return { value: { visualFirst: offState.value.visualFirst } }
            },
            subscribe() {
              return () => {}
            },
            set() {
              return Promise.resolve()
            },
          }
          const offHost = makeContext({})
          offHost.ctx.configForms = {
            get(namespace) {
              return namespace === 'dsh-dyslexia' ? offFace : null
            },
          }
          module.apply(offHost.ctx)
          const offDef = offHost.defs.find((entry) => entry.def && entry.def.name === 'settings.general.item')
          const offView = offDef ? mount(offDef.component, offDef.def.inject()) : null
          if (offView) await tick(40)
          const offToggle = offView ? offView.stage.querySelector('button[role="switch"]') : null
          expect(
            !!offToggle && offToggle.getAttribute('aria-checked') === 'false',
            'the switch starts off when the host already says off',
            offToggle ? String(offToggle.getAttribute('aria-checked')) : 'no switch',
          )
          if (offView) {
            offView.root.unmount()
            offView.stage.remove()
          }
          // A host whose face can read but not write shows the same failure as a
          // rejected write: the switch stays on the value in effect and the
          // status sentence says so. Showing the intended value would be a lie.
          const noSetFace = {
            getSnapshot() {
              return { value: { visualFirst: true } }
            },
            subscribe() {
              return () => {}
            },
          }
          const noSetHost = makeContext({})
          noSetHost.ctx.configForms = {
            get(namespace) {
              return namespace === 'dsh-dyslexia' ? noSetFace : null
            },
          }
          module.apply(noSetHost.ctx)
          const noSetDef = noSetHost.defs.find((entry) => entry.def && entry.def.name === 'settings.general.item')
          // The outcome alone cannot tell "the row saw there is no writer" from
          // "the row called a writer that threw": the face is the only thing that
          // knows the host cannot write, so the row must be handed no writer at all.
          const noSetInject = noSetDef && typeof noSetDef.def.inject === 'function' ? noSetDef.def.inject() : {}
          expect(
            typeof noSetInject.setValue === 'undefined',
            'a host whose face has no setter hands the row no writer at all',
            `setValue is ${typeof noSetInject.setValue}`,
          )
          const noSetView = noSetDef ? mount(noSetDef.component, noSetDef.def.inject()) : null
          if (noSetView) await tick(40)
          const noSetToggle = noSetView ? noSetView.stage.querySelector('button[role="switch"]') : null
          let noSetThrew = null
          if (noSetToggle) {
            try {
              noSetToggle.click()
            } catch (error) {
              noSetThrew = error
            }
            await tick(60)
          }
          const noSetStatus = noSetView ? noSetView.stage.querySelector('[role="status"]') : null
          expect(
            !!noSetToggle &&
              noSetThrew === null &&
              noSetToggle.getAttribute('aria-checked') === 'true' &&
              !!noSetStatus &&
              noSetStatus.textContent === SETTINGS_FAILED,
            'a host whose face has no setter keeps the switch and says the write failed',
            noSetToggle
              ? `aria-checked=${noSetToggle.getAttribute('aria-checked')} status=${
                  noSetStatus ? noSetStatus.textContent : 'none'
                } set=${typeof noSetFace.set} threw=${noSetThrew ? String(noSetThrew.message) : 'no'}`
              : 'no switch',
          )
          if (noSetView) {
            noSetView.root.unmount()
            noSetView.stage.remove()
          }
          noSetHost.dispose()

          // Without the face there is no row, and the picture must still work:
          // the settings surface is an addition, never a requirement.
          const plainHost = makeContext({})
          let plainThrew = null
          try {
            module.apply(plainHost.ctx)
          } catch (error) {
            plainThrew = error
          }
          expect(
            plainThrew === null &&
              plainHost.defs.length === 1 &&
              plainHost.defs[0].def.name === 'conversation.chat.markdown.fence',
            'a host without configForms gets the picture and no settings row',
            `${plainHost.defs.length} defs, threw=${plainThrew ? String(plainThrew.message) : 'no'}`,
          )
          const plainView = mount(plainHost.defs[0].component, { code: CODE, streaming: false, children: hostBlock(CODE) })
          await tick(80)
          expect(
            plainView.stage.querySelector('[role="img"]') !== null &&
              plainView.stage.querySelector('.dsh-dyslexia-row') === null,
            'the picture still draws when the settings surface is missing',
          )
          plainView.root.unmount()
          plainView.stage.remove()
          plainHost.dispose()

          // Client entries apply in parallel, so `configForms` can arrive after
          // `apply` has run; reading it once would skip the row forever.
          const lateHost = makeContext({})
          module.apply(lateHost.ctx)
          const lateBefore = lateHost.defs.filter((entry) => entry.def && entry.def.name === 'settings.general.item')
          lateHost.provide('configForms', {
            get(namespace) {
              return namespace === 'dsh-dyslexia' ? settingsFace : null
            },
          })
          const lateDefs = lateHost.defs.filter((entry) => entry.def && entry.def.name === 'settings.general.item')
          expect(
            lateBefore.length === 0 &&
              lateDefs.length === 1 &&
              lateDefs[0].def.id === '@jiezhengj/dsh-dyslexia/visual-first',
            'a host that gains configForms after apply still gets the settings row',
            `${lateBefore.length} before, ${lateDefs.length} after`,
          )
          lateHost.dispose()

          // A face that answers null is the same as no face at all.
          const blankHost = makeContext({})
          blankHost.ctx.configForms = {
            get() {
              return null
            },
          }
          module.apply(blankHost.ctx)
          expect(
            blankHost.defs.length === 1 &&
              blankHost.defs[0].def.name === 'conversation.chat.markdown.fence',
            'a configForms face that answers nothing adds no row',
            `${blankHost.defs.length} defs`,
          )
          blankHost.dispose()

          // The real host does not hand the row a `hooks` object: it turns each
          // entry of the slot's `hooks` face into a hook prop named after it, so
          // the row receives `useVisualFirst(value => value)`. A row that only
          // looked for `hooks` returned nothing there, which is how the switch
          // vanished from a real settings page while every fixture stayed green.
          const hookState = { value: { visualFirst: true } }
          const hookSets = []
          const hookListeners = new Set()
          let hookSnapshot = null
          const hookFace = {
            getSnapshot() {
              if (!hookSnapshot || hookSnapshot.value.visualFirst !== hookState.value.visualFirst) {
                hookSnapshot = { value: { visualFirst: hookState.value.visualFirst } }
              }
              return hookSnapshot
            },
            subscribe(listener) {
              hookListeners.add(listener)
              return () => hookListeners.delete(listener)
            },
            set(field, value) {
              hookSets.push([field, value])
              // A real host answers over the bridge: the switch has to show what
              // the reader asked for while that answer is on its way, so the
              // fixture must not settle synchronously (it did, which hid the
              // optimistic frame entirely).
              return new Promise((resolve) => {
                setTimeout(() => {
                  hookState.value[field] = value
                  hookListeners.forEach((listener) => listener())
                  resolve(true)
                }, 30)
              })
            },
          }
          function useVisualFirst(selector) {
            const snapshot = React.useSyncExternalStore(
              (listener) => hookFace.subscribe(listener),
              () => hookFace.getSnapshot(),
            )
            const value = snapshot && snapshot.value ? snapshot.value.visualFirst : undefined
            return typeof selector === 'function' ? selector(value === undefined ? true : value !== false) : value
          }
          const hookDef = {
            name: 'settings.general.item',
            id: '@jiezhengj/dsh-dyslexia/visual-first',
            order: 62,
            locale: 'dyslexia',
            inject: {
              hooks: { visualFirst: null },
              useVisualFirst,
              setValue: (next) => hookFace.set('visualFirst', next),
              readHostValue: () => hookState.value.visualFirst,
            },
          }
          const HookRow = module.RowComponentForTest ? module.RowComponentForTest : null
          void HookRow
          const hookView = mount(Row, hookDef.inject)
          await tick(40)
          const hookRow = hookView.stage.querySelector('.dsh-dyslexia-row')
          const hookToggle = hookView.stage.querySelector('button[role="switch"]')
          expect(
            !!hookRow,
            'a host that passes hooks as hook props still gets a visible row',
            hookRow ? 'row' : 'nothing rendered',
          )
          expect(
            !!hookToggle && hookToggle.getAttribute('aria-checked') === 'true',
            'the switch follows the value the host hook reports',
            hookToggle ? `aria-checked=${hookToggle.getAttribute('aria-checked')}` : 'no switch',
          )
          if (hookToggle) {
            hookToggle.dispatchEvent(new window.MouseEvent('click', { bubbles: true, cancelable: true }))
            // Before the host answers, the switch must already show what the
            // reader asked for; otherwise a slow bridge leaves the control on the
            // old value and the click looks ignored.
            await tick(6)
            const pendingToggle = hookView.stage.querySelector('button[role="switch"]')
            expect(
              !!pendingToggle && pendingToggle.getAttribute('aria-checked') === 'false',
              'a pending write shows the requested value before the host answers',
              pendingToggle ? `aria-checked=${pendingToggle.getAttribute('aria-checked')}` : 'no switch',
            )
            await tick(80)
          }
          expect(
            hookSets.length === 1 && hookSets[0][0] === 'visualFirst' && hookSets[0][1] === false,
            'clicking the switch writes through the writer the host gave it',
            JSON.stringify(hookSets),
          )
          const hookAfter = hookView.stage.querySelector('button[role="switch"]')
          expect(
            !!hookAfter && hookAfter.getAttribute('aria-checked') === 'false',
            'the switch then shows the value the host now holds',
            hookAfter ? `aria-checked=${hookAfter.getAttribute('aria-checked')}` : 'no switch',
          )
          hookView.root.unmount()
          hookView.stage.remove()

          // A snapshot that carries no field means "default", and the default is
          // on. `readHostValue` has to answer `true` for the same reason: a
          // refused write puts the switch back to what the host would show.
          const degradedShapes = [
            ['a snapshot that carries no field', () => ({ value: {} }), true],
            ['a snapshot that is not an object', () => null, true],
            ['a snapshot getter that throws', () => { throw new Error('snapshot unavailable') }, true],
          ]
          for (const [label, snapshotOf, expectedOn] of degradedShapes) {
            const degradedFace = {
              getSnapshot() {
                return snapshotOf()
              },
              subscribe() {
                return () => undefined
              },
              set() {
                return new Promise((resolve) => resolve(false))
              },
            }
            const degradedHost = makeContext({})
            degradedHost.ctx.configForms = { get: () => degradedFace }
            let degradedThrew = null
            try {
              module.apply(degradedHost.ctx)
            } catch (error) {
              degradedThrew = error
            }
            const degradedDef = degradedHost.defs.find((entry) => entry.def && entry.def.name === 'settings.general.item')
            let degradedToggle = null
            let degradedView = null
            if (degradedDef) {
              degradedView = mount(
                degradedDef.component,
                typeof degradedDef.def.inject === 'function' ? degradedDef.def.inject() : {},
              )
              await tick(60)
              degradedToggle = degradedView.stage.querySelector('button[role="switch"]')
            }
            expect(
              degradedThrew === null &&
                !!degradedToggle &&
                degradedToggle.getAttribute('aria-checked') === String(expectedOn),
              label + ' still shows the switch on',
              degradedToggle ? `aria-checked=${degradedToggle.getAttribute('aria-checked')}` : 'no switch',
            )
            if (degradedView) {
              degradedView.root.unmount()
              degradedView.stage.remove()
            }
            degradedHost.dispose()
          }

          // A host whose strict cordis refuses a service this module never
          // declared still draws the picture and still gets the row: `ctx.get`
          // is the read that does not need `inject`.
          const strictHost = makeContext({ noLocale: true })
          const strictLocaleCalls = []
          const strictLocale = {
            register(namespace, dictionary) {
              strictLocaleCalls.push([namespace, Object.keys(dictionary || {}).length])
              return () => undefined
            },
          }
          // Reading a service as a property on this host throws; only `ctx.get`
          // answers. A bare `ctx.locale` would lose the strings, so the strings
          // have to arrive through the reader.
          Object.defineProperty(strictHost.ctx, 'locale', {
            configurable: true,
            get() {
              throw new Error('cannot get property "locale" without inject')
            },
          })
          strictHost.ctx.get = function get(name) {
            if (name === 'locale') return strictLocale
            if (name === 'configForms') return { get: () => settingsFace }
            return undefined
          }
          let strictThrew = null
          try {
            module.apply(strictHost.ctx)
          } catch (error) {
            strictThrew = error
          }
          expect(
            strictThrew === null,
            'a host that refuses undeclared services is still served without a throw',
            strictThrew ? String(strictThrew.message) : 'quiet',
          )
          expect(
            strictHost.defs.some((entry) => entry.def && entry.def.name === 'settings.general.item'),
            'a host whose services must be read through ctx.get still gets the row',
            `${strictHost.defs.length} defs`,
          )
          expect(
            strictLocaleCalls.length === 1 && strictLocaleCalls[0][0] === 'dyslexia' && strictLocaleCalls[0][1] >= 8,
            'a host that refuses undeclared properties still gets the strings registered',
            JSON.stringify(strictLocaleCalls),
          )
          strictHost.dispose()
        } catch (error) {
          bad('fixture aborted', String(error && error.stack ? error.stack.split('\n')[0] : error))
        }

        const failed = results.filter((entry) => entry[0] === 'bad').length
        const passed = results.length - failed
        document.getElementById('log').textContent = results.map((entry) => `[${entry[0]}] ${entry[1]}`).join('\n')
        document.documentElement.setAttribute('data-dsh-checks', `ok:${passed}/failed:${failed}`)
      })()
    </script>
  </body>
</html>
